<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criativos &amp; VSL · Protótipo — Central TMX</title>
<style>
  :root{
    color-scheme: light;
    --sup:#FFFFFF; --plano:#F6F7F9; --linha:#E4E7EC;
    --tinta:#0B0B0B; --tinta2:#52514E; --tinta3:#898781;
    --grade:#E9EBEF; --eixo:#C3C2BD;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
    --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --bom:#0ca30c; --atencao:#fab219; --serio:#ec835a; --critico:#d03b3b;
    --marca:#3E1493;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --sup:#131826; --plano:#0B0E17; --linha:#252C3F;
      --tinta:#FFFFFF; --tinta2:#C3C2B7; --tinta3:#898781;
      --grade:#1E2536; --eixo:#39415A;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
      --s6:#008300; --s7:#9085e9; --s8:#e66767;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --sup:#131826; --plano:#0B0E17; --linha:#252C3F;
    --tinta:#FFFFFF; --tinta2:#C3C2B7; --tinta3:#898781;
    --grade:#1E2536; --eixo:#39415A;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--plano);color:var(--tinta);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

  .topo{display:flex;align-items:center;gap:11px;padding:13px 22px;background:var(--sup);
    border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .marca{font-weight:800;font-size:15px;letter-spacing:-.3px}
  .marca small{color:var(--tinta3);font-weight:600}
  select,button,input{font-family:inherit}
  select{background:var(--plano);border:1px solid var(--linha);border-radius:8px;
    padding:7px 11px;color:var(--tinta);font-size:13px;outline:none;cursor:pointer}
  .bt{background:var(--marca);color:#fff;border:none;border-radius:8px;padding:7px 14px;
    font-size:12.5px;font-weight:700;cursor:pointer}
  .bt.g{background:transparent;border:1px solid var(--linha);color:var(--tinta2)}
  .bt.g.on{border-color:var(--marca);color:var(--marca)}
  .bt.sm{padding:5px 10px;font-size:11.5px}
  .dir{margin-left:auto;display:flex;gap:8px;align-items:center}

  main{padding:18px 22px 60px;max-width:1280px;margin:0 auto}
  .tit{font-size:12px;font-weight:800;color:var(--tinta3);text-transform:uppercase;
    letter-spacing:.9px;margin:24px 0 11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tit:first-child{margin-top:0}
  .tit .aux{margin-left:auto;display:flex;gap:6px;text-transform:none;letter-spacing:0}

  .vfaixa{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:10px}
  .vcard{background:var(--sup);border:1.5px solid var(--linha);border-radius:12px;padding:12px 14px;
    cursor:pointer;transition:.14s;position:relative}
  .vcard:hover{border-color:var(--tinta3);transform:translateY(-1px)}
  .vcard.on{border-color:var(--cor,var(--marca));box-shadow:0 0 0 2px color-mix(in srgb,var(--cor,var(--marca)) 18%,transparent)}
  .vcard .chk{position:absolute;top:10px;right:10px;width:17px;height:17px;border-radius:5px;
    border:1.5px solid var(--linha);display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff}
  .vcard.on .chk{background:var(--cor,var(--marca));border-color:transparent}
  .vcard .nm{font-size:12.5px;font-weight:800;padding-right:22px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vcard .mini{display:flex;gap:12px;margin-top:9px}
  .vcard .mini div{min-width:0}
  .vcard .mini .r{font-size:9px;font-weight:800;color:var(--tinta3);text-transform:uppercase;letter-spacing:.4px}
  .vcard .mini .v{font-size:15px;font-weight:800;letter-spacing:-.4px}
  .vcard .rod{font-size:9.5px;font-weight:800;color:var(--bom);margin-top:7px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
  .tile{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:13px 15px}
  .tile .r{font-size:10px;font-weight:800;color:var(--tinta3);text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:5px}
  .tile .v{font-size:24px;font-weight:800;letter-spacing:-.9px;line-height:1.05}
  .tile .s{font-size:11px;color:var(--tinta2);margin-top:4px}
  .tile.destaque{border-color:var(--marca);box-shadow:0 0 0 2px color-mix(in srgb,var(--marca) 14%,transparent)}
  .tile.destaque .v{color:var(--marca)}

  .cartao{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:18px 20px;margin-bottom:15px}
  .cab{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:4px;flex-wrap:wrap}
  .cab h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .cab p{font-size:12.5px;color:var(--tinta2);margin-top:3px;max-width:660px}
  .acoes{display:flex;gap:6px;flex-wrap:wrap}

  .legenda{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 4px}
  .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tinta2);
    padding:3px 7px;border-radius:6px}
  .lg i{width:11px;height:11px;border-radius:3px;display:block}

  svg{display:block;width:100%;overflow:visible}
  .grade line{stroke:var(--grade);stroke-width:1}
  .eixo line{stroke:var(--eixo);stroke-width:1}
  .rot{font-size:10.5px;fill:var(--tinta3);font-variant-numeric:tabular-nums}
  .serie{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .dl{font-size:11px;font-weight:700}
  .pitch line{stroke:var(--critico);stroke-width:1.5}
  .pitch text{font-size:10.5px;fill:var(--critico);font-weight:800}

  .dica{position:fixed;pointer-events:none;background:var(--sup);border:1px solid var(--linha);
    border-radius:9px;padding:9px 12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.16);
    opacity:0;transition:opacity .1s;z-index:50;min-width:170px}
  .dica.on{opacity:1}
  .dica .h{font-weight:800;margin-bottom:5px;font-variant-numeric:tabular-nums}
  .dica .l{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:11.5px}
  .dica .l i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .dica .l b{margin-left:auto;font-variant-numeric:tabular-nums}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:9px 10px;font-size:10px;font-weight:800;color:var(--tinta3);
    text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--linha);
    cursor:pointer;white-space:nowrap}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  td{padding:10px;border-bottom:1px solid var(--linha)}
  tbody tr:hover{background:var(--plano)}

  .diag{display:grid;grid-template-columns:repeat(auto-fit,minmax(286px,1fr));gap:12px}
  .dcard{background:var(--sup);border:1px solid var(--linha);border-left-width:3px;
    border-radius:12px;padding:14px 16px}
  .dcard .t{font-size:13px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .dcard .d{font-size:12.5px;color:var(--tinta2);line-height:1.6}
  .dcard .a{font-size:12px;margin-top:9px;font-weight:700}

  .funil .et{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .funil .nm{width:168px;flex:0 0 auto;font-size:12.5px}
  .funil .barra{flex:1;height:25px;background:var(--plano);border-radius:5px;overflow:hidden}
  .funil .barra i{display:block;height:100%;border-radius:5px}
  .funil .vl{width:128px;flex:0 0 auto;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
  .funil .vl b{font-weight:800}
  .funil .vl span{color:var(--tinta3)}

  .nota{font-size:11.5px;color:var(--tinta3);margin-top:10px;line-height:1.6}
  .fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;
    justify-content:center;z-index:60;padding:20px}
  .fundo.on{display:flex}
  .modal{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:22px;
    width:100%;max-width:520px;max-height:82vh;overflow-y:auto}
  .modal h2{font-size:16px;font-weight:800;margin-bottom:3px}
  .modal p.sub{font-size:12.5px;color:var(--tinta2);margin-bottom:15px}
  .lreg{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--linha)}
  .lreg:last-of-type{border:none}
  .lreg .info{flex:1;min-width:0}
  .lreg .info b{font-size:13px;display:block}
  .lreg .info small{font-size:11px;color:var(--tinta3)}
  .sw{width:38px;height:21px;border-radius:20px;background:var(--linha);position:relative;
    cursor:pointer;flex:0 0 auto;transition:.15s}
  .sw.on{background:var(--bom)}
  .sw i{position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;
    background:#fff;transition:.15s}
  .sw.on i{left:19.5px}

  @media(max-width:720px){
    main{padding:15px 13px 50px}
    .funil .nm{width:100px;font-size:11.5px}
    .funil .vl{width:94px;font-size:11.5px}
    .vfaixa{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<div class="topo">
  <div class="marca">Criativos &amp; VSL <small>· protótipo</small></div>
  <select id="f-projeto"><option>CONCURSO</option><option>RENDA EXTRA</option><option>Principal</option></select>
  <select id="f-periodo" onchange="montar()">
    <option value="hoje">Hoje</option><option value="7d" selected>7 dias</option><option value="30d">30 dias</option>
  </select>
  <div class="dir">
    <button class="bt g" onclick="abrirCadastro()">⚙ VSLs rodando</button>
    <button class="bt g" onclick="trocarTema()" id="bt-tema">🌙 Escuro</button>
  </div>
</div>

<main>
  <div class="tit">Suas VSLs no ar
    <span class="aux">
      <button class="bt g sm" onclick="selTodas()">Selecionar todas</button>
      <button class="bt g sm" onclick="selUma()">Só a primeira</button>
    </span>
  </div>
  <div class="vfaixa" id="faixa-vsl"></div>
  <div class="nota" id="dica-sel"></div>
  <div id="conteudo"></div>
</main>

<div class="fundo" id="m-cad">
  <div class="modal">
    <h2>VSLs que estão rodando</h2>
    <p class="sub">Só as ligadas aparecem na faixa e entram nas métricas. As 36 da conta continuam
       existindo na VTurb — aqui você escolhe quais quer acompanhar.</p>
    <div id="lista-cad"></div>
    <button class="bt" style="width:100%;margin-top:16px" onclick="fecharCadastro()">Pronto</button>
  </div>
</div>

<div class="dica" id="dica"></div>

<script>
// ══════════════════════════════════════════════════════════
// Dados simulados. VSL de 36min52 com pitch aos 29min — como as suas.
// Cada VSL tem pontos de abandono próprios, senão a comparação não diria nada.
// ══════════════════════════════════════════════════════════
var DUR=2212, PITCH=1740;
var SLOTS=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];

var VSLS=[
  { id:'v1', nome:'top VSL — Lead 01', rodando:true, k:.00092, playRate:71.2,
    cliques:1431, inv:1180.40, vendas:4, receita:3988.00,
    degraus:[{t:262,perda:.11},{t:1262,perda:.13},{t:1748,perda:.10}] },
  { id:'v2', nome:'PAG 01 — Lead 01', rodando:true, k:.00121, playRate:66.9,
    cliques:1190, inv:902.10, vendas:2, receita:1794.00,
    degraus:[{t:198,perda:.17},{t:900,perda:.09},{t:1748,perda:.12}] },
  { id:'v3', nome:'NVPG — Lead 01', rodando:true, k:.00078, playRate:74.6,
    cliques:1044, inv:876.10, vendas:5, receita:5485.00,
    degraus:[{t:340,perda:.07},{t:1500,perda:.08},{t:1748,perda:.06}] },
  { id:'v4', nome:'PAG 03 — Lead 01', rodando:true, k:.00164, playRate:58.2,
    cliques:612, inv:410.70, vendas:1, receita:997.00,
    degraus:[{t:96,perda:.22},{t:700,perda:.11},{t:1748,perda:.14}] },
  { id:'v5', nome:'PAG 02 — Lead 01', rodando:false, k:.00110, playRate:63.0,
    cliques:380, inv:250.00, vendas:1, receita:997.00, degraus:[{t:300,perda:.12}] },
  { id:'v6', nome:'PAG 04 — Lead 01', rodando:false, k:.00135, playRate:60.4,
    cliques:290, inv:198.30, vendas:0, receita:0, degraus:[{t:250,perda:.15}] }
];
var sel=['v1'];

function fator(v,t){
  var f=1;
  (v.degraus||[]).forEach(function(d){
    if(t>=d.t) f*=(1-d.perda);
    else if(t>d.t-16) f*=(1-d.perda*((t-(d.t-16))/16));
  });
  return f;
}
function ret(v,t){
  var inicio=1-0.34*(1-Math.exp(-t/9));
  return Math.max(0, inicio*Math.exp(-v.k*t)*fator(v,t)*100);
}
function pontos(v,passo,ate){
  var p=[]; for(var t=0;t<=(ate||DUR);t+=passo) p.push({t:t,y:ret(v,t)}); return p;
}
VSLS.forEach(function(v){
  v.pessoas  = Math.round(v.cliques*(v.playRate/100));
  v.ret1min  = ret(v,60);
  v.pctPitch = ret(v,PITCH);
  v.noPitch  = Math.round(v.pessoas*v.pctPitch/100);
  v.ticket   = v.vendas? v.receita/v.vendas : 0;
  v.roas     = v.inv? v.receita/v.inv : 0;
  v.custoPitch = v.noPitch? v.inv/v.noPitch : 0;
});
// a cor acompanha a VSL, nunca a posição na lista: filtrar não repinta ninguém
function corDe(v){ return SLOTS[VSLS.indexOf(v)%8]; }
function ativos(){ return VSLS.filter(function(v){ return v.rodando; }); }
function selecionadas(){ return VSLS.filter(function(v){ return sel.indexOf(v.id)>=0; }); }

var brl=function(v){ return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); };
var num=function(v){ return Number(Math.round(v)).toLocaleString('pt-BR'); };
var mmss=function(s){ return Math.floor(s/60)+'min'+String(Math.round(s%60)).padStart(2,'0'); };

// ══ FAIXA DE SELEÇÃO ══
function faixa(){
  document.getElementById('faixa-vsl').innerHTML = ativos().map(function(v){
    var on = sel.indexOf(v.id)>=0;
    return '<div class="vcard '+(on?'on':'')+'" style="--cor:'+corDe(v)+'" onclick="alternar(\''+v.id+'\')">'+
      '<div class="chk">'+(on?'✓':'')+'</div>'+
      '<div class="nm">'+v.nome+'</div>'+
      '<div class="mini">'+
        '<div><div class="r">1º min</div><div class="v" style="color:'+corDe(v)+'">'+v.ret1min.toFixed(0)+'%</div></div>'+
        '<div><div class="r">Ticket</div><div class="v">'+(v.ticket?('R$ '+Math.round(v.ticket)):'—')+'</div></div>'+
        '<div><div class="r">Pitch</div><div class="v">'+v.pctPitch.toFixed(1)+'%</div></div>'+
      '</div>'+
      '<div class="rod">● rodando · '+brl(v.inv)+'</div>'+
    '</div>';
  }).join('');
  var n=sel.length;
  document.getElementById('dica-sel').textContent = n===1
    ? 'Uma selecionada — abaixo está a análise completa dela. Clique em outra pra comparar.'
    : n+' selecionadas — abaixo estão lado a lado. Clique numa pra tirar da comparação.';
}
function alternar(id){
  var i=sel.indexOf(id);
  if(i>=0){ if(sel.length===1) return; sel.splice(i,1); }
  else sel.push(id);
  montar();
}
function selTodas(){ sel=ativos().map(function(v){ return v.id; }); montar(); }
function selUma(){ sel=[ativos()[0].id]; montar(); }

// ══ CADASTRO ══
function abrirCadastro(){
  document.getElementById('lista-cad').innerHTML = VSLS.map(function(v){
    return '<div class="lreg"><div class="info"><b>'+v.nome+'</b>'+
      '<small>36min52 · pitch 29min00 · '+brl(v.inv)+' investidos</small></div>'+
      '<div class="sw '+(v.rodando?'on':'')+'" onclick="ligarVsl(\''+v.id+'\',this)"><i></i></div></div>';
  }).join('');
  document.getElementById('m-cad').classList.add('on');
}
function ligarVsl(id,el){
  var v=VSLS.filter(function(x){return x.id===id;})[0];
  v.rodando=!v.rodando; el.classList.toggle('on',v.rodando);
  if(!v.rodando){ var i=sel.indexOf(id); if(i>=0) sel.splice(i,1); }
  if(!sel.length && ativos().length) sel=[ativos()[0].id];
}
function fecharCadastro(){ document.getElementById('m-cad').classList.remove('on'); montar(); }

// ══ QUEDAS ══
function quedas(v,passo,ate){
  var pts=pontos(v,passo||20,ate||DUR), achados=[], jan=6;
  for(var i=1;i<pts.length;i++){
    if(pts[i].t<25) continue;                       // a saída do começo é esperada
    var perda=pts[i-1].y-pts[i].y; if(perda<=0) continue;
    // Em % de quem restou, não em pontos: no fim da VSL a retenção já é baixa e
    // uma queda grave vale poucos pontos — em pontos, as quedas perto do pitch sumiriam.
    var rel=perda/Math.max(pts[i-1].y,.01);
    var a=Math.max(1,i-jan), b=Math.min(pts.length-1,i+jan), soma=0, n=0;
    for(var j=a;j<=b;j++){ if(j===i) continue;
      soma+=Math.max(0,(pts[j-1].y-pts[j].y)/Math.max(pts[j-1].y,.01)); n++; }
    var tipica=n?soma/n:0;
    if(tipica>.0005 && rel>tipica*2.6 && rel>.035)
      achados.push({t0:pts[i-1].t,t1:pts[i].t,de:pts[i-1].y,para:pts[i].y,perda:perda,
                    relativa:rel*100,severidade:rel/tipica});
  }
  var j2=[];
  achados.sort(function(a,b){return a.t0-b.t0;}).forEach(function(q){
    var u=j2[j2.length-1];
    if(u && q.t0-u.t1<=40){ u.t1=q.t1; u.para=q.para; u.perda=u.de-u.para;
      u.relativa=u.perda/Math.max(u.de,.01)*100; u.severidade=Math.max(u.severidade,q.severidade); }
    else j2.push(Object.assign({},q));
  });
  return j2.sort(function(a,b){ return b.relativa-a.relativa; }).slice(0,4);
}
function piorQueda(v){ var q=quedas(v); return q.length?q[0]:null; }
function impacto(v,q){
  var perdidos=v.pessoas*(q.perda/100);
  var sobrevive=q.para>0?(v.pctPitch/q.para):0;
  var extra=perdidos*0.5*sobrevive;
  var porVenda=v.noPitch?(v.vendas/v.noPitch):0;
  var vendas=extra*porVenda;
  return { perdidos:perdidos, extra:extra, vendas:vendas, receita:vendas*v.ticket };
}

// ══ GRÁFICO ══
var L=52,R=118,T=16,B=34,H=250;
function eixos(W,ticks,janela){
  var s='<g class="grade">';
  for(var i=0;i<=4;i++){ var y=T+(H-T-B)*(i/4); s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>'; }
  s+='</g><g class="eixo"><line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/></g>';
  for(var i=0;i<=4;i++){ var y=T+(H-T-B)*(i/4);
    s+='<text class="rot" x="'+(L-9)+'" y="'+(y+3.5)+'" text-anchor="end">'+Math.round(100*(1-i/4))+'%</text>'; }
  ticks.forEach(function(tk){
    var x=L+(W-L-R)*(tk/janela);
    var r=janela<=300 ? (Math.floor(tk/60)+':'+String(tk%60).padStart(2,'0')) : (Math.round(tk/60)+'min');
    s+='<text class="rot" x="'+x+'" y="'+(H-B+16)+'" text-anchor="middle">'+r+'</text>';
  });
  return s;
}
function marcaPitch(W,janela,rot){
  if(PITCH>janela) return '';
  var x=L+(W-L-R)*(PITCH/janela);
  return '<g class="pitch"><line x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+(H-B)+'"/>'+
    (rot?'<text x="'+(x-7)+'" y="'+(T+11)+'" text-anchor="end">PITCH 29min</text>':'')+'</g>';
}
function traco(pts,W,janela){
  return pts.filter(function(p){return p.t<=janela;}).map(function(p,i){
    return (i?'L':'M')+(L+(W-L-R)*(p.t/janela)).toFixed(1)+' '+(T+(H-T-B)*(1-p.y/100)).toFixed(1);
  }).join(' ');
}
// rótulos no fim da linha: as curvas terminam quase juntas, então afasta sem trocar a ordem
function rotulos(series,W,janela){
  var m=series.map(function(se){
    var u=se.pts.filter(function(p){return p.t<=janela;}).pop();
    return {nome:se.nome,cor:se.cor,valor:u.y,x:L+(W-L-R)*(u.t/janela),yl:T+(H-T-B)*(1-u.y/100)};
  }).sort(function(a,b){return a.yl-b.yl;});
  var ant=-99; m.forEach(function(x){ x.yt=Math.max(x.yl,ant+13); ant=x.yt; });
  var exc=m.length?(m[m.length-1].yt-(H-B-6)):0;
  if(exc>0) m.forEach(function(x){ x.yt-=exc; });
  return m.map(function(x){
    var fio = Math.abs(x.yt-x.yl)>1.5
      ? '<path d="M '+(x.x+2)+' '+x.yl.toFixed(1)+' L '+(x.x+6)+' '+x.yt.toFixed(1)+'" stroke="'+x.cor+'" stroke-width="1" fill="none" opacity=".5"/>' : '';
    return fio+'<text class="dl" x="'+(x.x+9)+'" y="'+(x.yt+3.5).toFixed(1)+'" fill="'+x.cor+'">'+
      x.nome+' <tspan opacity=".75">'+x.valor.toFixed(1)+'%</tspan></text>';
  }).join('');
}
function hover(el,W,series,janela){
  var svg=el.querySelector('svg'); if(!svg) return;
  var dica=document.getElementById('dica');
  var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
  ln.setAttribute('stroke','var(--eixo)'); ln.setAttribute('stroke-width','1');
  ln.setAttribute('y1',T); ln.setAttribute('y2',H-B); ln.style.opacity=0; svg.appendChild(ln);
  svg.addEventListener('mousemove',function(ev){
    var cx=svg.getBoundingClientRect(), rel=(ev.clientX-cx.left)/cx.width*W;
    if(rel<L||rel>W-R){ dica.classList.remove('on'); ln.style.opacity=0; return; }
    var t=Math.round((rel-L)/(W-L-R)*janela), px=L+(W-L-R)*(t/janela);
    ln.setAttribute('x1',px); ln.setAttribute('x2',px); ln.style.opacity=.85;
    dica.innerHTML='<div class="h">'+mmss(t)+(t>=PITCH?' · após o pitch':'')+'</div>'+
      series.map(function(se){
        var p=se.pts.reduce(function(a,b){ return Math.abs(b.t-t)<Math.abs(a.t-t)?b:a; });
        return '<div class="l"><i style="background:'+se.cor+'"></i>'+se.nome+'<b>'+p.y.toFixed(1)+'%</b></div>';
      }).join('');
    dica.classList.add('on');
    dica.style.left=Math.min(innerWidth-210,ev.clientX+16)+'px';
    dica.style.top=(ev.clientY-14)+'px';
  });
  svg.addEventListener('mouseleave',function(){ dica.classList.remove('on'); ln.style.opacity=0; });
}

// ══ MONTAGEM ══
var zoom='tudo';
function setZoom(z){ zoom=z; montar(); }
function tile(r,v,s,cls){
  return '<div class="tile '+(cls||'')+'"><div class="r">'+r+'</div><div class="v">'+v+'</div>'+
    '<div class="s">'+s+'</div></div>';
}
function botoesZoom(){
  return '<div class="acoes">'+
    '<button class="bt g '+(zoom==='tudo'?'on':'')+'" onclick="setZoom(\'tudo\')">VSL inteira</button>'+
    '<button class="bt g '+(zoom==='1min'?'on':'')+'" onclick="setZoom(\'1min\')">1º minuto</button></div>';
}

function htmlIndividual(){
  var v=selecionadas()[0], q=piorQueda(v), im=q?impacto(v,q):null;
  return '<div class="tit">'+v.nome+'</div>'+
  '<div class="tiles">'+
    tile('Investido',brl(v.inv),num(v.cliques)+' cliques')+
    tile('Retenção 1º min',v.ret1min.toFixed(1)+'%','de quem deu play','destaque')+
    tile('Deram play',v.playRate.toFixed(1)+'%',num(v.pessoas)+' pessoas')+
    tile('Chegam no pitch',v.pctPitch.toFixed(1)+'%',num(v.noPitch)+' pessoas')+
    tile('Ticket médio',v.ticket?brl(v.ticket):'—',v.vendas+' venda(s)')+
    tile('Custo por pitch',brl(v.custoPitch),'pra 1 pessoa ver a oferta')+
    tile('ROAS',v.roas.toFixed(2)+'x',brl(v.receita-v.inv)+' de lucro')+
  '</div>'+
  (q?('<div class="tit">Maior abandono</div>'+
  '<div class="dcard" style="border-left-color:var(--critico);margin-bottom:15px">'+
    '<div class="t">🔻 O pior trecho é '+mmss(q.t0)+' → '+mmss(q.t1)+'</div>'+
    '<div class="d">Some <b>'+q.relativa.toFixed(0)+'% de quem ainda assistia</b> em '+
      Math.round(q.t1-q.t0)+'s — cerca de '+Math.round(q.severidade)+'x a saída normal desse trecho. '+
      'A retenção cai de '+q.de.toFixed(1)+'% para '+q.para.toFixed(1)+'%.</div>'+
    '<div class="a" style="color:var(--critico)">Recuperando metade: +'+num(im.extra)+
      ' no pitch · +'+im.vendas.toFixed(1)+' venda(s) · '+brl(im.receita)+'</div></div>'):'')+
  '<div class="cartao"><div class="cab"><div><h2>Curva de retenção</h2>'+
    '<p>Círculos vermelhos são quedas fora do normal. Passe o mouse pra ver minuto a minuto.</p></div>'+
    botoesZoom()+'</div><div id="g1"></div></div>'+
  '<div class="tit">Todas as quedas</div><div class="diag" id="quedas"></div>'+
  '<div class="tit">O caminho inteiro</div>'+
  '<div class="cartao"><div class="cab"><div><h2>Da impressão à venda</h2>'+
    '<p>Cada etapa vem de uma fonte diferente.</p></div></div><div class="funil" id="funil"></div></div>';
}

function htmlComparativo(){
  var vs=selecionadas();
  return '<div class="tit">Comparando '+vs.length+' VSLs</div>'+
  '<div class="cartao"><div class="cab"><div><h2>Curvas sobrepostas</h2>'+
    '<p>Mesma escala pras '+vs.length+'. Onde as linhas se separam é onde uma ganha da outra.</p></div>'+
    botoesZoom()+'</div>'+
    '<div class="legenda">'+vs.map(function(v){
      return '<span class="lg"><i style="background:'+corDe(v)+'"></i>'+v.nome+'</span>'; }).join('')+'</div>'+
    '<div id="g1"></div></div>'+
  '<div class="cartao"><div class="cab"><div><h2>Lado a lado</h2>'+
    '<p>Clique no cabeçalho pra ordenar. Verde marca o melhor de cada coluna.</p></div></div>'+
    '<div style="overflow-x:auto"><table id="tcomp"></table></div>'+
    '<div class="nota">Retenção, play rate e abandono vêm da VTurb. Investido, vendas e ticket vêm da Utmify.</div></div>'+
  '<div class="tit">Maior abandono de cada uma</div><div class="diag" id="quedas"></div>';
}

function montar(){
  faixa();
  document.getElementById('conteudo').innerHTML =
    selecionadas().length===1 ? htmlIndividual() : htmlComparativo();
  pintar();
}

function pintar(){
  var vs=selecionadas(), janela = zoom==='1min'?60:DUR, passo = zoom==='1min'?1:20;
  var ticks = zoom==='1min'?[0,10,20,30,40,50,60]:[0,300,600,900,1200,1500,1740,2100];
  var el=document.getElementById('g1'); if(!el) return;
  var W=el.clientWidth||820;
  var series=vs.map(function(v){
    return {nome:v.nome.replace(' — Lead 01',''),cor:corDe(v),pts:pontos(v,passo,janela)}; });
  var s='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'">'+eixos(W,ticks,janela)+marcaPitch(W,janela,true);
  series.forEach(function(se){ s+='<path class="serie" style="stroke:'+se.cor+'" d="'+traco(se.pts,W,janela)+'"/>'; });
  if(vs.length===1){
    quedas(vs[0],passo,janela).forEach(function(q,i){
      var x0=L+(W-L-R)*(q.t0/janela), x1=L+(W-L-R)*(q.t1/janela);
      var xm=(x0+x1)/2, ym=T+(H-T-B)*(1-((q.de+q.para)/2)/100);
      s+='<rect x="'+x0.toFixed(1)+'" y="'+T+'" width="'+Math.max(2,x1-x0).toFixed(1)+'" height="'+(H-T-B)+
         '" fill="var(--critico)" opacity=".10"/>'+
         '<circle cx="'+xm.toFixed(1)+'" cy="'+ym.toFixed(1)+'" r="9" fill="var(--critico)"/>'+
         '<text x="'+xm.toFixed(1)+'" y="'+(ym+3.6).toFixed(1)+'" text-anchor="middle" font-size="10.5" '+
         'font-weight="800" fill="#fff">'+(i+1)+'</text>';
    });
  }
  s+=rotulos(series,W,janela)+'</svg>';
  el.innerHTML=s;
  hover(el,W,series,janela);
  if(vs.length===1){ cartoesQuedas(vs[0]); funil(vs[0]); } else { comparativo(vs); quedasDeCada(vs); }
}

function cartoesQuedas(v){
  var el=document.getElementById('quedas'); if(!el) return;
  var qs=quedas(v);
  if(!qs.length){ el.innerHTML='<div class="nota">Nenhuma queda fora do normal — a curva desce de forma constante.</div>'; return; }
  el.innerHTML=qs.map(function(q,i){
    var im=impacto(v,q);
    return '<div class="dcard" style="border-left-color:var(--critico)">'+
      '<div class="t"><span style="background:var(--critico);color:#fff;width:19px;height:19px;'+
        'border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px">'+(i+1)+'</span>'+
        mmss(q.t0)+' → '+mmss(q.t1)+'</div>'+
      '<div class="d">Some <b>'+q.relativa.toFixed(0)+'%</b> de quem ainda assistia — '+
        num(im.perdidos)+' pessoas. Retenção de '+q.de.toFixed(1)+'% para '+q.para.toFixed(1)+'%.</div>'+
      '<div class="a" style="color:var(--critico)">Metade recuperada: +'+im.vendas.toFixed(1)+
        ' venda(s) · '+brl(im.receita)+'</div></div>';
  }).join('');
}
function quedasDeCada(vs){
  var el=document.getElementById('quedas'); if(!el) return;
  el.innerHTML=vs.map(function(v){
    var q=piorQueda(v);
    if(!q) return '<div class="dcard" style="border-left-color:var(--bom)"><div class="t">'+v.nome+'</div>'+
      '<div class="d">Sem queda fora do normal.</div></div>';
    return '<div class="dcard" style="border-left-color:'+corDe(v)+'">'+
      '<div class="t"><i style="width:10px;height:10px;border-radius:2px;background:'+corDe(v)+'"></i>'+v.nome+'</div>'+
      '<div class="d">Pior trecho: <b>'+mmss(q.t0)+' → '+mmss(q.t1)+'</b> — some '+q.relativa.toFixed(0)+
        '% de quem assistia.</div>'+
      '<div class="a" style="color:'+corDe(v)+'">Ticket '+(v.ticket?brl(v.ticket):'—')+' · ROAS '+v.roas.toFixed(2)+'x</div></div>';
  }).join('');
}

var ordComp={col:'roas',asc:false};
function comparativo(vs){
  var cols=[['nome','VSL',0],['ret1min','1º min',1],['playRate','Play rate',1],['pctPitch','Chega no pitch',1],
    ['inv','Investido',1],['ticket','Ticket médio',1],['custoPitch','Custo por pitch',1],
    ['vendas','Vendas',1],['roas','ROAS',1]];
  var lista=vs.slice().sort(function(a,b){
    var x=a[ordComp.col],y=b[ordComp.col];
    if(typeof x==='string') return ordComp.asc?x.localeCompare(y):y.localeCompare(x);
    return ordComp.asc?x-y:y-x;
  });
  var melhor={};
  ['ret1min','playRate','pctPitch','ticket','vendas','roas'].forEach(function(k){
    melhor[k]=Math.max.apply(null,vs.map(function(v){return v[k];})); });
  var comCusto=vs.filter(function(v){return v.custoPitch>0;});
  if(comCusto.length) melhor.custoPitch=Math.min.apply(null,comCusto.map(function(v){return v.custoPitch;}));
  var f={ inv:brl, ticket:function(v){return v?brl(v):'—';}, custoPitch:brl,
    ret1min:function(v){return v.toFixed(1)+'%';}, playRate:function(v){return v.toFixed(1)+'%';},
    pctPitch:function(v){return v.toFixed(1)+'%';}, roas:function(v){return v.toFixed(2)+'x';},
    vendas:String };
  var h='<thead><tr>'+cols.map(function(c){
    return '<th class="'+(c[2]?'num':'')+'" onclick="ordComparativo(\''+c[0]+'\')">'+c[1]+
      (ordComp.col===c[0]?(ordComp.asc?' ↑':' ↓'):'')+'</th>'; }).join('')+'</tr></thead><tbody>';
  lista.forEach(function(v){
    h+='<tr>'+cols.map(function(c){
      var k=c[0];
      if(k==='nome') return '<td><span style="display:inline-flex;align-items:center;gap:7px">'+
        '<i style="width:9px;height:9px;border-radius:2px;background:'+corDe(v)+'"></i>'+v.nome+'</span></td>';
      var eh = melhor[k]!==undefined && Math.abs(v[k]-melhor[k])<1e-9;
      return '<td class="num" style="'+(eh?'color:var(--bom);font-weight:800':'')+'">'+
        (f[k]?f[k](v[k]):v[k])+'</td>';
    }).join('')+'</tr>';
  });
  document.getElementById('tcomp').innerHTML=h+'</tbody>';
}
function ordComparativo(col){
  if(ordComp.col===col) ordComp.asc=!ordComp.asc; else { ordComp.col=col; ordComp.asc=(col==='nome'); }
  comparativo(selecionadas());
}

function funil(v){
  var el=document.getElementById('funil'); if(!el) return;
  var imp=Math.round(v.cliques/0.021);
  var et=[['Impressões',imp,'Meta'],['Cliques no anúncio',v.cliques,'Meta'],
    ['Deram play',v.pessoas,'VTurb'],['Passaram do 1º min',Math.round(v.pessoas*v.ret1min/100),'VTurb'],
    ['Chegaram no pitch',v.noPitch,'VTurb'],['Clicaram no botão',Math.round(v.noPitch*0.42),'VTurb'],
    ['Venda aprovada',v.vendas,'Utmify']];
  var tons=['#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab'];
  el.innerHTML=et.map(function(e,i){
    var pc=e[1]/et[0][1]*100, queda=i?(100-e[1]/Math.max(et[i-1][1],1)*100):0;
    return '<div class="et"><div class="nm">'+e[0]+'<div style="font-size:10px;color:var(--tinta3)">'+e[2]+'</div></div>'+
      '<div class="barra"><i style="width:'+Math.max(pc,.4)+'%;background:'+tons[i]+'"></i></div>'+
      '<div class="vl"><b>'+num(e[1])+'</b> <span>'+pc.toFixed(2)+'%</span>'+
      (i?'<div style="font-size:10.5px;color:var(--critico)">−'+queda.toFixed(0)+'%</div>':'')+'</div></div>';
  }).join('');
}

function trocarTema(){
  var a=document.documentElement.getAttribute('data-theme');
  var n = a==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  document.getElementById('bt-tema').textContent = n==='dark'?'☀️ Claro':'🌙 Escuro';
  montar();
}
document.getElementById('m-cad').addEventListener('click',function(e){ if(e.target===this) fecharCadastro(); });
montar();
addEventListener('resize', pintar);
</script>
