<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central da Diretoria · TMX Digital (protótipo)</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;}
  :root{
    --bg:#0b0b0f; --bg2:#121218; --bg3:#1a1a22; --card:#15151c; --line:rgba(255,255,255,.07);
    --tx:#eceef2; --tx2:#9a9aa8; --tx3:#6b6b78;
    --grad:linear-gradient(135deg,#3E1493 0%,#C52C58 55%,#1B9CFA 100%);
    --purple:#7C3AED; --red:#ef4444; --orange:#f97316; --green:#22c55e; --blue:#3b82f6;
  }
  body{background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;font-size:14px;}
  a{color:inherit;text-decoration:none;}
  .app{display:grid;grid-template-columns:60px 1fr;grid-template-rows:56px 1fr;height:100vh;}

  /* TOPBAR */
  .topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg2);}
  .logo{display:flex;align-items:baseline;gap:6px;font-weight:900;font-size:19px;letter-spacing:-.4px;}
  .logo .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  .logo .d{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--tx2);}
  .topbar .sub{color:var(--tx3);font-size:12px;border-left:1px solid var(--line);padding-left:16px;}
  .topbar .spacer{flex:1;}
  .search{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--tx2);font-size:13px;cursor:pointer;min-width:220px;}
  .search kbd{margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;}
  .tbtn{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--tx);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .tbtn.grad{background:var(--grad);border:none;font-weight:600;box-shadow:0 4px 16px rgba(62,20,147,.4);}
  .chip{width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}

  /* RAIL */
  .rail{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;}
  .rail button{width:42px;height:42px;border-radius:11px;border:none;background:transparent;color:var(--tx2);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative;}
  .rail button:hover{background:var(--bg3);color:var(--tx);}
  .rail button.active{background:rgba(124,58,237,.18);color:#c4b5fd;}
  .rail button.active::before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--grad);}
  .rail .tip{position:absolute;left:52px;background:#000;border:1px solid var(--line);padding:4px 9px;border-radius:7px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:20;}
  .rail button:hover .tip{opacity:1;}

  .main{overflow:hidden;position:relative;}
  .view{display:none;height:100%;overflow:auto;}
  .view.on{display:block;}

  /* ===== PAINEL (split) ===== */
  .painel{display:grid;grid-template-columns:380px 1fr;height:100%;}
  .col-w{border-right:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--bg);}
  .col-n{overflow-y:auto;padding:34px 46px;}
  .widget{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .wh{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .wh h3{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--tx);}
  .wh .cnt{background:var(--bg3);color:var(--tx2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;}
  .wh .act{margin-left:auto;display:flex;gap:6px;}
  .mini{background:var(--bg3);border:1px solid var(--line);color:var(--tx2);border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer;}
  .mini:hover{color:var(--tx);}
  .mini.on{background:rgba(124,58,237,.2);color:#c4b5fd;border-color:transparent;}

  /* aprovar */
  .aprov{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg2);}
  .aprov .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;}
  .aprov .info{flex:1;min-width:0;}
  .aprov .t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .aprov .m{font-size:11px;color:var(--tx3);}
  .aprov .ok{background:var(--green);border:none;color:#052e16;font-weight:700;border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer;}

  /* notas list */
  .nota{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:.12s;}
  .nota:hover{background:var(--bg3);}
  .nota.sel{background:rgba(124,58,237,.15);}
  .nota input{accent-color:var(--purple);width:15px;height:15px;}
  .nota .ic{font-size:15px;}
  .nota .tt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .addpage{color:var(--tx3);font-size:12px;padding:8px;cursor:pointer;}
  .addpage:hover{color:var(--tx);}

  /* rotina kanban */
  .kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .kbcol{min-width:150px;flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;}
  .kbcol .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .kbcol .h .d{font-size:12px;font-weight:700;}
  .kbcol .h .n{background:var(--bg3);color:var(--tx2);font-size:10px;font-weight:700;padding:0 6px;border-radius:10px;}
  .kbcol.hoje .h .d{color:#c4b5fd;}
  .kbcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:7px;font-size:12px;display:flex;gap:7px;align-items:flex-start;cursor:grab;}
  .kbcard input{accent-color:var(--green);margin-top:1px;}
  .kbcard.done span{text-decoration:line-through;color:var(--tx3);}
  .kbadd{color:var(--tx3);font-size:11px;cursor:pointer;padding:2px;}
  .kbadd:hover{color:var(--tx);}

  /* note pane */
  .breadcrumb{display:flex;gap:7px;align-items:center;color:var(--tx3);font-size:12px;margin-bottom:22px;}
  .breadcrumb b{color:var(--tx2);font-weight:500;}
  .note h1{font-size:38px;font-weight:900;letter-spacing:-1px;margin-bottom:14px;line-height:1.1;}
  .note .props{display:flex;gap:14px;align-items:center;color:var(--tx3);font-size:12px;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line);}
  .note h2{font-size:23px;font-weight:800;margin:26px 0 10px;letter-spacing:-.3px;}
  .note h3{font-size:17px;font-weight:700;margin:20px 0 8px;color:var(--tx);}
  .note p{color:var(--tx2);line-height:1.75;margin-bottom:12px;max-width:760px;}
  .note .lead{color:var(--tx3);font-size:13px;}
  .subp{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px;font-weight:600;cursor:pointer;width:fit-content;}
  .subp:hover{color:#c4b5fd;}
  .subp .ic{color:var(--tx3);}
  .todo{display:flex;align-items:center;gap:9px;padding:4px 0;color:var(--tx);}
  .todo input{accent-color:var(--purple);width:16px;height:16px;}
  .todo.done label{text-decoration:line-through;color:var(--tx3);}
  .bul{padding-left:6px;}
  .bul li{list-style:none;padding:4px 0;color:var(--tx2);position:relative;padding-left:18px;}
  .bul li::before{content:'•';position:absolute;left:2px;color:var(--tx3);}
  .r{color:#f87171;font-weight:600;} .o{color:#fb923c;font-weight:600;}
  .lk{color:#93c5fd;text-decoration:underline;text-underline-offset:2px;}

  /* ===== PASTAS ===== */
  .pastas{display:grid;grid-template-columns:250px 1fr;height:100%;}
  .fbar{border-right:1px solid var(--line);overflow-y:auto;padding:16px 10px;background:var(--bg);}
  .fbar .sec{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--tx3);padding:6px 8px;display:flex;align-items:center;gap:6px;}
  .fnav{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx2);}
  .fnav:hover{background:var(--bg3);color:var(--tx);}
  .fnav.sel{background:rgba(124,58,237,.15);color:#c4b5fd;}
  .fnav .ic{font-size:14px;}
  .fmain{overflow-y:auto;padding:22px 30px;}
  .fmain .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .fitem{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:.12s;}
  .fitem:hover{border-color:rgba(124,58,237,.4);background:var(--bg3);}
  .fitem .ficon{width:40px;height:40px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .fitem.link .ficon{background:rgba(124,58,237,.18);color:#c4b5fd;}
  .fitem.cred .ficon{background:rgba(34,197,94,.15);color:#4ade80;}
  .fitem.tool .ficon{background:rgba(59,130,246,.15);color:#60a5fa;}
  .fitem .fbody{flex:1;min-width:0;}
  .fitem .fttl{font-size:15px;font-weight:700;}
  .fitem .fdesc{font-size:12px;color:var(--tx3);margin-top:2px;}
  .tag{display:inline-block;background:var(--bg);border:1px solid var(--line);color:var(--tx2);font-size:10px;padding:2px 8px;border-radius:6px;margin-top:7px;margin-right:6px;}
  .fitem .fright{display:flex;gap:8px;align-items:center;}
  /* credencial box */
  .cred-fields{display:none;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .cred-fields.show{display:flex;}
  .cf{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;}
  .cf .k{color:var(--tx3);}
  .cf .v{font-family:ui-monospace,monospace;color:var(--tx);}
  .cf button{background:var(--bg3);border:1px solid var(--line);color:var(--tx2);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;}
  .cf button:hover{color:var(--tx);}
  .send{background:var(--grad);border:none;color:#fff;border-radius:7px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#000;border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:100;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast b{color:#4ade80;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:6px;} ::-webkit-scrollbar-track{background:transparent;}
  .proto{position:fixed;top:62px;right:14px;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.4);color:#c4b5fd;font-size:11px;padding:3px 9px;border-radius:20px;z-index:30;}
  @media(max-width:900px){
    body{overflow:auto;} .app{height:auto;min-height:100vh;grid-template-columns:52px 1fr;}
    .topbar .sub,.topbar .search{display:none;}
    .main{overflow:visible;} .view{height:auto;}
    .painel{display:block;height:auto;} .col-w{border-right:none;border-bottom:1px solid var(--line);}
    .col-n{padding:22px 16px;}
    .pastas{display:block;height:auto;} .fbar{border-right:none;border-bottom:1px solid var(--line);}
    .fmain{padding:16px;} .note h1{font-size:28px;}
    .proto{top:auto;bottom:14px;right:10px;}
  }
</style>
</head>
<body>
<div class="proto">🧪 protótipo · dados de exemplo</div>
<div class="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo"><span class="g">TMX</span><span class="d">DIGITAL</span></div>
    <div class="sub">Central da Diretoria</div>
    <div class="spacer"></div>
    <div class="search" onclick="toast('Busca ⌘K (protótipo)')">🔎 Buscar <kbd>⌘K</kbd></div>

    <button class="tbtn grad" onclick="toast('Novo link/atalho')">🔗 Link</button>
    <div class="chip">T</div>
  </div>

  <!-- RAIL -->
  <div class="rail">
    <button class="active" data-view="painel" onclick="go('painel',this)">🎛️<span class="tip">Painel</span></button>
    <button data-view="pastas" onclick="go('pastas',this)">📁<span class="tip">Pastas & Links</span></button>
    <button onclick="go('painel',this,'notas')">📝<span class="tip">Anotações</span></button>
    <button onclick="go('painel',this,'rotina')">🗓️<span class="tip">Rotina</span></button>
    <button onclick="go('painel',this,'aprov')">✅<span class="tip">Aprovações</span></button>
    <button onclick="go('pastas',this,'cred')">🔑<span class="tip">Credenciais</span></button>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- PAINEL -->
    <div class="view on" id="view-painel">
      <div class="painel">
        <div class="col-w">
          <!-- Aprovar -->
          <div class="widget" id="w-aprov">
            <div class="wh"><h3>Aprovar</h3><span class="cnt" id="aprov-cnt">3</span>
              <div class="act"><button class="mini on">Pendentes</button><button class="mini">Aprovados</button></div></div>
            <div id="aprov-list"></div>
          </div>
          <!-- Anotações -->
          <div class="widget" id="w-notas">
            <div class="wh"><h3>Anotações</h3><span class="cnt" id="notas-cnt">15</span>
              <div class="act"><button class="mini on">Lista</button><button class="mini">Arquivados</button></div></div>
            <div id="notas-list"></div>
            <div class="addpage" onclick="toast('Nova página')">＋ Nova página</div>
          </div>
          <!-- Rotina -->
          <div class="widget" id="w-rotina">
            <div class="wh"><h3>Rotina da semana</h3>
              <div class="act"><button class="mini" onclick="toast('Limpar semana')">🧹 Limpar</button><button class="mini on">Quadro</button><button class="mini">Lista</button></div></div>
            <div class="kanban" id="kanban"></div>
          </div>
        </div>
        <div class="col-n" id="note-pane"></div>
      </div>
    </div>

    <!-- PASTAS -->
    <div class="view" id="view-pastas">
      <div class="pastas">
        <div class="fbar">
          <div class="fnav sel" onclick="abrirPasta('raiz',this)"><span class="ic">🏠</span> Raiz</div>
          <div class="sec">🏳️ MASSAS</div>
          <div id="fbar-list"></div>
        </div>
        <div class="fmain">
          <div class="top">
            <div class="breadcrumb" id="fbread"></div>
            <div class="act"><button class="mini on">☰ Lista</button><button class="mini">▦ Grade</button></div>
          </div>
          <div id="fmain-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

var DIAS=[['Segunda',2,true],['Terça',0],['Quarta',3],['Quinta',1],['Sexta',2]];
var TAREFAS={Segunda:['Reunião de planejamento (16h)','Revisar métricas RedTrack'],Terça:[],Quarta:['Aprovar criativos','Call sócios','Alinhamento liderança'],Quinta:['Weekly de performance'],Sexta:['Fechar relatório da semana','Definir OKRs']};

/* PASTAS tree */
var PASTAS={
  raiz:{nome:'Raiz',filhos:['aula','rhfin','rituais','entrega','pessoal','sistemas','ferr','gestao']},
  aula:{nome:'AULA IMPORTANTE QUE TEMOS DE MENTORIA',tipo:'pasta',desc:'',filhos:[]},
  rhfin:{nome:'RH / FINANCEIRO',tipo:'pasta',filhos:[]},
  rituais:{nome:'RITUAIS / ANÁLISE DE OFERTAS',tipo:'pasta',filhos:['l1','l2','l3','l4']},
  entrega:{nome:'ENTREGA DOS LÍDERES',tipo:'pasta',filhos:[]},
  pessoal:{nome:'PESSOAL',tipo:'pasta',filhos:[]},
  sistemas:{nome:'SISTEMAS INTERNOS | TMX',tipo:'pasta',desc:'',tag:'sistema',cnt:'7 vídeos',filhos:[]},
  ferr:{nome:'FERRAMENTAS | TMX',tipo:'pasta',desc:'Onde fica todas as nossas ferramentas (de cada área)',tag:'ferramentas',cnt:'13 itens',filhos:['t1','c1','c2']},
  gestao:{nome:'GESTÃO | TMX',tipo:'pasta',desc:'Aqui é a central de tudo o que fazemos na empresa.',tag:'gestão geral',cnt:'19 itens',filhos:[]},
  l1:{nome:'estratégico',tipo:'link'},
  l2:{nome:'Reunião de Análise de Dados',tipo:'link'},
  l3:{nome:'Weekly de Performance Criativa',tipo:'link'},
  l4:{nome:'RELATÓRIO DE ANÁLISE DA SEMANA',tipo:'link'},
  t1:{nome:'RedTrack — Dashboard',tipo:'tool',desc:'Rastreamento de campanhas'},
  c1:{nome:'Meta Business Manager',tipo:'cred',desc:'Conta de anúncios principal',login:'ads@tmxdigital.com',senha:'••••••••••',senhaReal:'Tmx#Meta2026'},
  c2:{nome:'CartPanda — Checkout',tipo:'cred',desc:'Plataforma de checkout',login:'financeiro@tmxdigital.com',senha:'••••••••••',senhaReal:'Cp@Tmx!2026'}
};
var pastaAtual='raiz';

/* ============ RENDER ============ */
function el(id){return document.getElementById(id);}
function toast(msg){var t=el('toast');t.innerHTML=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},1900);}

function renderAprov(){el('aprov-list').innerHTML=APROVACOES.map(function(a){return '<div class="aprov"><span class="dot"></span><div class="info"><div class="t">'+a.t+'</div><div class="m">'+a.m+'</div></div><button class="ok" onclick="toast(\'✅ Aprovado\')">Aprovar</button></div>';}).join('');el('aprov-cnt').textContent=APROVACOES.length;}

function renderNotas(){el('notas-list').innerHTML=NOTAS.map(function(n){return '<div class="nota'+(n.id===notaSel?' sel':'')+'" onclick="abrirNota(\''+n.id+'\')"><input type="checkbox" onclick="event.stopPropagation()"><span class="ic">'+n.ic+'</span><span class="tt">'+n.t+'</span></div>';}).join('');el('notas-cnt').textContent=NOTAS.length;}

var notaSel='novo';
function abrirNota(id){notaSel=id;var c=CONTEUDO[id]||stub((NOTAS.filter(function(n){return n.id===id;})[0]||{}).t||'Nota');el('note-pane').innerHTML='<div class="breadcrumb">'+c.bread.map(function(b,i){return (i?'<span>/</span>':'')+'<b>'+b+'</b>';}).join(' ')+'<span style="margin-left:auto"></span><a class="lk" style="cursor:pointer" onclick="toast(\'🔗 Link da nota copiado\')">🔗 gerar link</a></div><div class="note">'+c.html+'</div>';renderNotas();}

function renderKanban(){el('kanban').innerHTML=DIAS.map(function(d){var tarefas=TAREFAS[d[0]]||[];return '<div class="kbcol'+(d[2]?' hoje':'')+'"><div class="h"><span class="d">'+d[0]+'</span><span class="n">'+tarefas.length+'</span></div>'+tarefas.map(function(t,i){var done=d[0]==='Quarta'&&i===0;return '<div class="kbcard'+(done?' done':'')+'"><input type="checkbox" '+(done?'checked':'')+' onclick="this.closest(\'.kbcard\').classList.toggle(\'done\')"><span>'+t+'</span></div>';}).join('')+'<div class="kbadd" onclick="toast(\'Nova tarefa em '+d[0]+'\')">＋ Nova</div></div>';}).join('');}

function renderFbar(){el('fbar-list').innerHTML=PASTAS.raiz.filhos.map(function(id){var p=PASTAS[id];return '<div class="fnav'+(id===pastaAtual?' sel':'')+'" onclick="abrirPasta(\''+id+'\',this)"><span class="ic">📁</span> '+p.nome+'</div>';}).join('');}

function abrirPasta(id,elm){pastaAtual=id;document.querySelectorAll('.fbar .fnav').forEach(function(f){f.classList.remove('sel');});if(elm)elm.classList.add('sel');
  var p=PASTAS[id];var filhos=(p.filhos||[]);
  // breadcrumb
  el('fbread').innerHTML='<b onclick="abrirPasta(\'raiz\')" style="cursor:pointer">Raiz</b>'+(id!=='raiz'?' <span>/</span> <b>'+p.nome+'</b>':'');
  if(id==='raiz')filhos=PASTAS.raiz.filhos;
  el('fmain-list').innerHTML=filhos.map(function(fid){var f=PASTAS[fid];return itemHtml(fid,f);}).join('')||'<div style="color:var(--tx3);padding:30px;text-align:center">Pasta vazia — clique em “＋ Link” pra adicionar.</div>';
  renderFbar();
}
function itemHtml(fid,f){
  var ic=f.tipo==='link'?'🔗':f.tipo==='cred'?'🔑':f.tipo==='tool'?'🔧':'📁';
  var cls=f.tipo||'pasta';
  var tags=(f.tag?'<span class="tag">'+f.tag+'</span>':'')+(f.cnt?'<span class="tag">'+f.cnt+'</span>':'');
  var click=(f.tipo==='pasta'||!f.tipo)?'onclick="abrirPasta(\''+fid+'\')"':(f.tipo==='cred'?'onclick="toggleCred(\''+fid+'\')"':'onclick="toast(\'Abrindo '+f.nome.replace(/\\'/g,'')+'\')"');
  var cred=f.tipo==='cred'?'<div class="cred-fields" id="cred-'+fid+'"><div class="cf"><span class="k">login</span><span class="v">'+f.login+'</span><button onclick="event.stopPropagation();copiar(\''+f.login+'\')">copiar</button></div><div class="cf"><span class="k">senha</span><span class="v" id="sv-'+fid+'">'+f.senha+'</span><button onclick="event.stopPropagation();verSenha(\''+fid+'\')">ver</button><button onclick="event.stopPropagation();copiar(\''+f.senhaReal+'\')">copiar</button></div><button class="send" onclick="event.stopPropagation();toast(\'📨 Credencial enviada pro colaborador\')">Enviar pro colaborador</button></div>':'';
  return '<div class="fitem '+cls+'" '+click+'><div class="ficon">'+ic+'</div><div class="fbody"><div class="fttl">'+f.nome+'</div>'+(f.desc?'<div class="fdesc">'+f.desc+'</div>':'')+tags+cred+'</div><div class="fright"><span style="color:var(--tx3)">›</span></div></div>';
}
function toggleCred(fid){el('cred-'+fid).classList.toggle('show');}
function verSenha(fid){var v=el('sv-'+fid);var f=PASTAS[fid];v.textContent=v.textContent.indexOf('•')>-1?f.senhaReal:f.senha;}
function copiar(txt){navigator.clipboard&&navigator.clipboard.writeText(txt);toast('📋 Copiado: <b>'+txt+'</b>');}

function go(view,btn,scroll){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on');});el('view-'+view).classList.add('on');document.querySelectorAll('.rail button').forEach(function(b){b.classList.remove('active');});document.querySelectorAll('.rail button[data-view="'+view+'"]').forEach(function(b){b.classList.add('active');});if(btn&&!btn.dataset.view)btn.classList.add('active');
  if(scroll==='cred')setTimeout(function(){abrirPasta('ferr');},50);
  if(scroll&&view==='painel'){var map={notas:'w-notas',rotina:'w-rotina',aprov:'w-aprov'};var t=el(map[scroll]);if(t)t.scrollIntoView({behavior:'smooth'});}
}

/* init */
renderAprov();renderNotas();renderKanban();abrirNota('novo');renderFbar();abrirPasta('raiz');
</script>
</body>
</html>
