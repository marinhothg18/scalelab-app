<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Vagas abertas · Axcend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0f0f0f; --bg-1:#1c1c1c; --bg-2:#252525;
    --border:#2a2a2a; --text:#f5f5f5; --text2:#a3a3a3;
    --accent:#5b5ef4; --roxo:#3E1493; --azul:#1B9CFA;
    --rosa:#C52C58; --laranja:#FF5926; --azul-profundo:#2509E4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg-0);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  .hero{
    background:linear-gradient(135deg, var(--azul-profundo) 0%, var(--roxo) 50%, var(--rosa) 100%);
    padding:80px 24px 100px;text-align:center;position:relative;overflow:hidden;
    margin-bottom:-50px;
  }
  .hero::before{content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 20% 20%, rgba(255,255,255,.08) 0%, transparent 50%);pointer-events:none;}
  .hero-inner{max-width:760px;margin:0 auto;position:relative;z-index:1;}
  .badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
    color:#fff;opacity:.85;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:99px;margin-bottom:18px;backdrop-filter:blur(8px);}
  .hero h1{font-size:48px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-bottom:14px;text-shadow:0 2px 20px rgba(0,0,0,.2);}
  .hero p{font-size:17px;color:#fff;opacity:.9;max-width:560px;margin:0 auto;}

  .wrap{max-width:880px;margin:0 auto;padding:0 24px 80px;}

  .lista{display:flex;flex-direction:column;gap:14px;}
  .card-vaga{
    background:var(--bg-1);border:1px solid var(--border);border-radius:14px;padding:24px 26px;
    transition:border-color .15s,transform .15s;display:block;
  }
  .card-vaga:hover{border-color:var(--accent);transform:translateY(-1px);}
  .card-vaga .meta-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .chip{display:inline-block;font-size:11px;font-weight:600;color:var(--text2);background:var(--bg-2);
    padding:4px 10px;border-radius:99px;}
  .chip.area{color:#fff;background:var(--accent);opacity:.85;}
  .card-vaga h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;letter-spacing:-.01em;}
  .card-vaga .descricao{font-size:14px;color:var(--text2);margin-bottom:14px;line-height:1.6;}
  .card-vaga .cta{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);font-weight:600;}
  .card-vaga:hover .cta{text-decoration:underline;}

  .vazio{text-align:center;padding:80px 20px;color:var(--text2);}
  .vazio h2{color:var(--text);font-size:22px;margin-bottom:10px;font-weight:700;}
  .vazio p{font-size:14px;}

  .estado{text-align:center;padding:100px 20px;color:var(--text2);}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .footer{text-align:center;padding:24px 0;color:var(--text2);font-size:12px;margin-top:30px;}
  .footer a{color:var(--text2);}

  @media (max-width:600px){
    .hero{padding:50px 20px 80px;}
    .hero h1{font-size:34px;}
    .hero p{font-size:15px;}
    .card-vaga{padding:20px;border-radius:12px;}
    .card-vaga h2{font-size:17px;}
    .wrap{padding:0 16px 60px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="badge">Faça parte do movimento</div>
    <h1>Vagas abertas</h1>
    <p>Posições que estamos contratando agora. Clique numa vaga pra saber tudo e se candidatar.</p>
  </div>
</div>

<div class="wrap">
  <div id="root">
    <div class="estado">
      <div class="spinner"></div>
      <p>Carregando vagas...</p>
    </div>
  </div>
</div>

<div class="footer">Powered by <a href="https://app.centralaxcend.com">Axcend</a></div>

<script>
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

  function render(vagas){
    var root = document.getElementById('root');
    if(!vagas.length){
      root.innerHTML = '<div class="vazio"><div style="font-size:48px;margin-bottom:14px;">📭</div>'+
        '<h2>Nenhuma vaga aberta no momento</h2>'+
        '<p>Volte em breve — estamos sempre contratando talento bom.</p></div>';
      return;
    }
    var html = '<div class="lista">' + vagas.map(function(v){
      var meta = [];
      if(v.area) meta.push('<span class="chip area">'+esc(v.area)+'</span>');
      if(v.modelo) meta.push('<span class="chip">'+esc(v.modelo)+'</span>');
      if(v.salario) meta.push('<span class="chip">💰 '+esc(v.salario)+'</span>');
      return '<a href="/vaga/'+encodeURIComponent(v.slug)+'" class="card-vaga">'+
        '<div class="meta-top">'+meta.join('')+'</div>'+
        '<h2>'+esc(v.titulo)+'</h2>'+
        (v.descricao ? '<div class="descricao">'+esc(v.descricao)+(v.descricao.length>=280?'…':'')+'</div>' : '')+
        '<div class="cta">Ver detalhes →</div>'+
      '</a>';
    }).join('') + '</div>';
    root.innerHTML = html;
  }

  fetch('/api/vagas/publicas')
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(){
      document.getElementById('root').innerHTML = '<div class="vazio"><h2>Erro ao carregar</h2><p>Tente recarregar a página.</p></div>';
    });
</script>

</body>
</html>
