<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Protocolo · Thiago Marinho (protótipo)</title>
<style>
  :root{--bg:#0f0f0f;--bg2:#1c1c1c;--bg3:#252525;--text:#fff;--text2:#888;--text3:#6b6b6b;--border:rgba(255,255,255,.07);--accent:#1B9CFA;--purple:#5b5ef4;--green:#639922;--red:#E24B4A;--grad:linear-gradient(135deg,#3E1493,#1B9CFA);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:22px 18px 100px;}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .top h1{font-size:22px;font-weight:800;margin:0;}
  .badge{font-size:11px;font-weight:700;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}
  .sub{color:var(--text2);font-size:13px;margin:0 0 16px;}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;-webkit-overflow-scrolling:touch;}
  .tab{flex-shrink:0;background:var(--bg2);color:var(--text2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .tab.on{background:var(--accent);color:#fff;border-color:transparent;}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
  .card h3{font-size:16px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .muted{color:var(--text3);font-size:12px;}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);}
  .row:first-child{border-top:none;}
  .ck{width:20px;height:20px;flex-shrink:0;border-radius:6px;border:2px solid var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
  .ck.on{background:var(--green);border-color:var(--green);}
  .hora{font-size:12px;color:var(--accent);font-weight:800;width:46px;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .txt{flex:1;font-size:14px;}
  .txt.done{color:var(--text3);text-decoration:line-through;}
  .del{color:var(--text3);cursor:pointer;font-size:13px;flex-shrink:0;}
  input,textarea{background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:9px 11px;font-size:13px;font-family:inherit;outline:none;}
  input:focus,textarea:focus{border-color:var(--accent);}
  .addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn{background:var(--grad);border:none;color:#fff;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .btn.ghost{background:var(--bg3);color:var(--text2);}
  .decl{font-size:14px;line-height:1.5;padding:7px 0;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
  .decl:first-child{border-top:none;}
  .bar{flex:1;height:7px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .bar>span{display:block;height:7px;background:var(--grad);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .son{background:var(--bg3);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .son .ph{height:110px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:26px;background-size:cover;background-position:center;}
  .son .bd{padding:10px 12px;}
  .pill{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--text2);border:1px solid var(--border);}
  a{color:var(--accent);}
  .kv{display:flex;gap:8px;font-size:13px;padding:6px 0;border-top:1px solid var(--border);}
  .kv:first-child{border-top:none;}
  .kv .k{color:var(--text3);width:120px;flex-shrink:0;}
  .ord{display:flex;flex-direction:column;gap:2px;}
  .arrow{cursor:pointer;color:var(--text3);font-size:11px;line-height:1;}
  .refl{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13px;}
  .refl:first-child{border-top:none;}
  .refl .c{color:var(--red);flex:1;}
  .refl .a{color:var(--green);flex:1;}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .dot{width:22px;height:22px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);}
  .dot.on{background:var(--green);border-color:var(--green);color:#fff;}
  .save-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:12px;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .3s;}
  .save-hint.show{opacity:1;}
</style>
</head>

function load(){ try{var v=localStorage.getItem('mp_data'); if(v) return Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(v));}catch(e){} return JSON.parse(JSON.stringify(DEFAULTS)); }

function vIdent(){
  var media=(S.caracteristicas.reduce(function(a,c){return a+c[1];},0)/S.caracteristicas.length).toFixed(1);
  var h='<div class="card"><h3>🧭 Identidade alvo</h3><textarea id="id-alvo" style="width:100%;min-height:90px" oninput="S.identidadeAlvo=this.value;save()">'+esc(S.identidadeAlvo)+'</textarea></div>';
  h+='<div class="card"><h3>📊 7 características fundamentais <span class="muted" style="font-weight:400">· média '+media+'/10</span></h3>'+S.caracteristicas.map(function(c,i){return '<div style="padding:9px 0;border-top:1px solid var(--border)"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:14px;font-weight:600;width:130px;flex-shrink:0">'+esc(c[0])+'</span><span class="bar"><span style="width:'+(c[1]*10)+'%"></span></span><input type="range" min="0" max="10" value="'+c[1]+'" oninput="setNota('+i+',this.value)" style="width:110px;padding:0"><span style="font-size:12px;color:var(--text2);width:36px;text-align:right">'+c[1]+'/10</span></div><div class="muted" style="margin-top:4px">Prioridade: <b style="color:var(--text2)">'+esc(c[2])+'</b> — '+esc(c[3])+'</div></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>🪞 Coerência — hoje × alvo</h3><div class="muted" style="margin-bottom:8px">Onde estiver em incoerência, ajusta agora — e marca</div>'+S.coerencia.map(function(c,i){return '<div style="padding:9px 0;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-start"><span class="ck '+(c[3]?'on':'')+'" onclick="tg(\'coerencia\','+i+',3)" style="margin-top:2px">'+(c[3]?'✓':'')+'</span><div style="flex:1"><div style="font-size:13px;font-weight:700">'+esc(c[0])+'</div><div class="muted" style="color:var(--red)">hoje: '+esc(c[1])+'</div><div class="muted" style="color:var(--green)">alvo: '+esc(c[2])+'</div></div></div>';}).join('')+'</div>';
  return h;
}
function vMente(){
  var h='<div class="card"><h3>🎛️ 3 alavancas pra dirigir o cérebro</h3><div class="muted" style="margin-bottom:6px">Robbins: '+"'"+'Cérebro é como qualquer máquina. Se você não dirige, ele dirige você.'+"'"+'</div>'+S.alavancas.map(function(a){return '<div style="padding:9px 0;border-top:1px solid var(--border)"><div style="font-size:14px;font-weight:700">'+esc(a[0])+'</div><div class="muted">'+esc(a[1])+'</div></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>🔄 Tabela de bolso — carência → abundância</h3><div class="muted" style="margin-bottom:8px">Toda frase de carência: troca na hora. Linguagem cria realidade.</div>'+S.reframe.map(function(r){return '<div class="refl"><span class="c">✗ '+esc(r[0])+'</span><span style="color:var(--text3)">→</span><span class="a">✓ '+esc(r[1])+'</span></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>🧪 5 técnicas pra dirigir a mente</h3>'+S.tecnicas.map(function(t,i){return '<div class="row"><span class="hora" style="color:var(--purple)">'+(i+1)+'</span><span class="txt">'+esc(t)+'</span></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>⚓ Ancoragens (PNL) <span class="muted" style="font-weight:400">· gatilho → estado</span></h3><div class="muted" style="margin-bottom:6px">Marque quando usar hoje</div>'+S.ancoragens.map(function(a,i){return '<div style="padding:9px 0;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-start"><span class="ck '+(a[3]?'on':'')+'" onclick="tg(\'ancoragens\','+i+',3)" style="margin-top:2px">'+(a[3]?'✓':'')+'</span><div style="flex:1"><div style="font-size:14px;font-weight:700">'+esc(a[0])+' <span class="muted" style="font-weight:400">— '+esc(a[2])+'</span></div><div class="muted">Gatilho: '+esc(a[1])+'</div></div></div>';}).join('')+'</div>';
  return h;
}
function vCrencas(){
  var h='<div class="card"><h3>🧠 As 7 crenças do sucesso</h3><div class="muted" style="margin-bottom:6px">Marque as que está instalando</div>'+S.crencas.map(function(c,i){return '<div style="padding:11px 0;border-top:1px solid var(--border);display:flex;gap:10px"><span class="ck '+(c[4]?'on':'')+'" onclick="tg(\'crencas\','+i+',4)" style="margin-top:2px">'+(c[4]?'✓':'')+'</span><div style="flex:1"><div style="font-size:14px;font-weight:700">'+(i+1)+'. '+esc(c[0])+'</div><div style="font-size:13px;color:var(--text2);margin:3px 0">'+esc(c[1])+'</div><div class="muted">Onde estou: '+esc(c[2])+'</div><div class="muted">Como instalar: '+esc(c[3])+'</div></div></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>🔁 Crenças a desinstalar</h3>'+S.desinstalar.map(function(d){return '<div style="padding:8px 0;border-top:1px solid var(--border)"><div style="font-size:13px;color:var(--red)">✗ '+esc(d[0])+'</div><div style="font-size:13px;color:var(--green)">✓ '+esc(d[1])+'</div></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>⚡ NAC — mudar uma crença de verdade</h3><div class="muted" style="margin-bottom:6px">Os 6 passos (Condicionamento Neuroassociativo). Instalar leva 21 dias — acompanhe na aba Hábitos.</div>'+S.nac.map(function(n,i){return '<div class="row"><span class="hora" style="color:var(--purple)">'+(i+1)+'</span><span class="txt">'+esc(n)+'</span></div>';}).join('')+'</div>';
  return h;
}
function vValores(){
  var h='<div class="card"><h3>⚖️ Meus valores <span class="muted" style="font-weight:400">· ordenados = decisão automática</span></h3><div class="muted" style="margin-bottom:8px">Quando dois valores conflitam, o de cima vence. Use as setas pra ordenar.</div>'+S.valores.map(function(v,i){return '<div style="display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border)"><div class="ord"><span class="arrow" onclick="mv(\'valores\','+i+',-1)">▲</span><span class="arrow" onclick="mv(\'valores\','+i+',1)">▼</span></div><span style="font-size:15px;font-weight:800;color:var(--accent);width:22px">'+(i+1)+'</span><div style="flex:1"><div style="font-size:14px;font-weight:700">'+esc(v[0])+'</div><div class="muted">'+esc(v[1])+'</div></div></div>';}).join('')+'</div>';
  return h;
}
function vLideranca(){
  var h='<div class="card"><h3>👑 Os 5 papéis do líder <span class="muted" style="font-weight:400">· nota atual → meta 90 dias</span></h3>'+S.papeis.map(function(p,i){return '<div style="padding:9px 0;border-top:1px solid var(--border)"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:14px;font-weight:600;width:120px;flex-shrink:0">'+esc(p[0])+'</span><span class="bar"><span style="width:'+(p[1]*10)+'%"></span></span><input type="range" min="0" max="10" value="'+p[1]+'" oninput="setPapel('+i+',this.value)" style="width:100px;padding:0"><span style="font-size:12px;color:var(--text2);width:60px;text-align:right">'+p[1]+' → '+p[2]+'</span></div><div class="muted" style="margin-top:4px">'+esc(p[3])+'</div></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>💬 3 mensagens diárias pro time <span class="muted" style="font-weight:400">· Cardone — cultura constrói</span></h3>'+S.msgsTime.map(function(m,i){return '<div style="padding:9px 0;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-start"><span class="hora">'+esc(m[0])+'</span><span class="ck '+(m[3]?'on':'')+'" onclick="tg(\'msgsTime\','+i+',3)" style="margin-top:1px">'+(m[3]?'✓':'')+'</span><div style="flex:1"><div style="font-size:13px;font-weight:700">'+esc(m[1])+'</div><div class="muted">'+esc(m[2])+'</div></div></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>🎚️ Senhor × Cumpridor × Escravo</h3><div class="muted" style="margin-bottom:6px">Saudável: 60/30/10 · Perigoso: 0/70/30</div>'+S.senhorEscravo.map(function(s){return '<div class="kv"><span class="k" style="width:100px;font-weight:700;color:var(--text)">'+esc(s[0])+'</span><span>'+esc(s[1])+'</span></div>';}).join('')+'</div>';
  h+='<div class="card"><h3>🗯️ Franqueza radical (Kim Scott)</h3><div class="muted">Empatia nociva (hoje) → Franqueza radical (alvo). Auto-pergunta antes de todo feedback: <b style="color:var(--text2)">"Estou cuidando OU evitando atrito?"</b> Se evitando = empatia nociva. Feedback SCI: Situação → Comportamento → Impacto → pedido.</div></div>';
  h+='<div class="card"><h3>🔥 Os 13 pilares da obcecação (Cardone)</h3>'+S.pilaresObc.map(function(p,i){return '<div class="row"><span class="hora" style="color:var(--red)">'+(i+1)+'</span><span class="txt">'+esc(p)+'</span></div>';}).join('')+'</div>';
  return h;
}
function vHabitos(){
  var h='<div class="card" style="background:var(--bg3)"><div class="muted">Mudança é instantânea — o preparo leva <b style="color:var(--text2)">21 dias</b> (NAC / Robbins). Escolha 1-2 hábitos por vez e marque cada dia. Não tente instalar 5 ao mesmo tempo.</div></div>';
  h+=S.habitos.map(function(ht,i){var feitos=ht[1].filter(Boolean).length;return '<div class="card"><h3>🔁 '+esc(ht[0])+' <span class="muted" style="font-weight:400">· '+feitos+'/21</span> <span class="del" style="margin-left:auto" onclick="rm(\'habitos\','+i+')">✕</span></h3><span class="bar" style="display:block"><span style="width:'+Math.round(feitos/21*100)+'%"></span></span><div class="dots">'+ht[1].map(function(d,j){return '<span class="dot '+(d?'on':'')+'" onclick="tgHabito('+i+','+j+')">'+(j+1)+'</span>';}).join('')+'</div></div>';}).join('');
  h+='<div class="card"><div class="addrow"><input id="hb-t" placeholder="Novo hábito / crença / protocolo pra instalar em 21 dias…" style="flex:1"><button class="btn" onclick="addHabito()">＋</button></div></div>';
  return h;
}
function vSonhos(){
  var h='<div class="card"><h3>✨ Quadro dos sonhos</h3><div class="grid">'+S.sonhos.map(function(s,i){return '<div class="son"><div class="ph" style="'+(s[2]?'background-image:url('+esc(s[2])+')':'')+'">'+(s[2]?'':'✨')+'<input type="file" accept="image/*" onchange="setImg('+i+',this)" style="display:none" id="sf'+i+'"></div><div class="bd"><div style="font-size:14px;font-weight:700;margin-bottom:5px">'+esc(s[0])+'</div><span class="pill">'+esc(s[1])+'</span> <span class="del" onclick="document.getElementById(\'sf'+i+'\').click()" style="font-size:11px">📷 foto</span> <span class="del" onclick="rm(\'sonhos\','+i+')">✕</span></div></div>';}).join('')+'</div><div class="addrow"><input id="so-t" placeholder="Novo sonho…" style="flex:1"><button class="btn" onclick="addSonho()">＋</button></div></div>';
  return h;
}
function vAncoras(){
  var h='<div class="card"><h3>🎬 Âncoras — vídeos que dão fé, ambientes, playlists</h3>'+S.ancoras.map(function(a,i){return '<div class="row"><span class="txt">🔗 <a href="'+esc(a[1])+'" target="_blank">'+esc(a[0])+'</a></span><span class="del" onclick="rm(\'ancoras\','+i+')">✕</span></div>';}).join('')+'<div class="addrow"><input id="an-t" placeholder="Título" style="flex:1"><input id="an-u" placeholder="https://…" style="flex:1"><button class="btn" onclick="addAncora()">＋</button></div></div>';
  return h;
}

function tg(k,i,idx){ var col=(idx==null?2:idx); S[k][i][col]=!S[k][i][col]; save(); render(); }
function tgArr(k,i){ S[k][i]=!S[k][i]; save(); render(); }
function tgHabito(i,j){ S.habitos[i][1][j]=!S.habitos[i][1][j]; save(); render(); }
function rm(k,i){ S[k].splice(i,1); save(); render(); }
function mv(k,i,d){ var j=i+d; if(j<0||j>=S[k].length)return; var t=S[k][i]; S[k][i]=S[k][j]; S[k][j]=t; save(); render(); }
function addAgenda(){ var hh=document.getElementById('ag-h').value.trim(), tt=document.getElementById('ag-t').value.trim(); if(!tt)return; S.agenda.push([hh||'',tt,false]); S.agenda.sort(function(a,b){return (a[0]||'~')<(b[0]||'~')?-1:1;}); save(); render(); }
function addObj(){ var tt=document.getElementById('ob-t').value.trim(); if(!tt)return; S.objetivos.push([tt,false]); save(); render(); }
function addSonho(){ var tt=document.getElementById('so-t').value.trim(); if(!tt)return; S.sonhos.push([tt,'Sonho','']); save(); render(); }
function addAncora(){ var tt=document.getElementById('an-t').value.trim(), uu=document.getElementById('an-u').value.trim(); if(!tt)return; S.ancoras.push([tt,uu||'#']); save(); render(); }
function addHabito(){ var tt=document.getElementById('hb-t').value.trim(); if(!tt)return; var arr=[]; for(var k=0;k<21;k++)arr.push(false); S.habitos.push([tt,arr]); save(); render(); }
function setNota(i,v){ S.caracteristicas[i][1]=+v; save(); render(); }
function setPapel(i,v){ S.papeis[i][1]=+v; save(); render(); }
function salvarDecisao(){ var t=document.getElementById('dec-t').value.trim(); S.decisaoHoje=t; if(t){ var d=new Date(); S.decisoes.unshift([('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2), t]); } save(); render(); }
function setImg(i,inp){ var f=inp.files&&inp.files[0]; if(!f)return; var r=new FileReader(); r.onload=function(){ S.sonhos[i][2]=r.result; save(); render(); }; r.readAsDataURL(f); }

var d=new Date(); var dias=['domingo','segunda','terça','quarta','quinta','sexta','sábado']; var meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
document.getElementById('hoje-data').textContent=dias[d.getDay()]+', '+d.getDate()+' de '+meses[d.getMonth()]+' de '+d.getFullYear();
renderTabs(); render();
</script>
</body>
</html>
