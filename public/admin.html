<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Central TMX Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Central TMX Admin (07/11/2026, versão 3): sistema à parte, só pra Diretoria da TMX.
   Painel, clientes com ficha, uso, receita, cobrança, pedidos, convites, suporte, saúde e auditoria.
   Os números vêm de /api/plataforma/painel (cada motor manda o resumo dele) e das rotas /api/plataforma/*.
   Gráficos com uma cor só (azul TMX); situação sempre com texto, nunca só cor. */
:root{
  --bg:#090A12; --bg2:#0E1019; --bg3:#171A2A; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --tx:#F4F5FA; --tx2:#A0A7BF; --tx3:#6B7290;
  --azul:#1B9CFA; --laranja:#FF5926;
  --grad:linear-gradient(135deg,#3E1493 0%,#2509E4 45%,#1B9CFA 100%);
  --serie:#1B9CFA;
  --ok-bg:rgba(12,163,12,.16); --aviso-bg:rgba(250,178,25,.14); --serio-bg:rgba(236,131,90,.15); --crit-bg:rgba(208,59,59,.16);
  --f-tit:'Plus Jakarta Sans','Inter',system-ui,sans-serif; --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(37,9,228,.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(62,20,147,.22),transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:14px/1.5 var(--f)}
button,input,select,textarea{font-family:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:rgba(9,10,18,.7);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:2px}
.marca{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.marca .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font:800 13px var(--f-tit);box-shadow:0 6px 20px rgba(37,9,228,.45);flex:none}
.marca b{display:block;font:800 15px var(--f-tit)}
.marca span{font-size:10.5px;letter-spacing:.2em;color:var(--tx3);font-weight:700}
.grupo{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:700;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:9px;background:none;color:#CDD2E3;font-size:13.5px;text-align:left;cursor:pointer;position:relative}
.nav:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.nav.on{background:linear-gradient(90deg,rgba(62,20,147,.55),rgba(27,156,250,.18));color:#fff}
.nav.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--azul)}
.nav svg{width:16px;height:16px;flex:none;opacity:.9}
.nav .n{margin-left:auto;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;background:rgba(255,89,38,.18);color:#FFB394}
.pe{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3);display:flex;flex-direction:column;gap:4px}
.pe b{color:var(--tx2);font-weight:600}
.pe a{color:#9FD3FF;text-decoration:none}
.main{min-width:0;padding-block:22px 64px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:0 6px 18px}
.topo h1{margin:0;font:800 24px/1.15 var(--f-tit);letter-spacing:-.01em;text-wrap:balance}
.topo p{margin:4px 0 0;color:var(--tx2);font-size:13px;max-width:72ch}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--tx);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:rgba(255,255,255,.28)}
.btn.pri{background:var(--grad);border-color:transparent;box-shadow:0 6px 18px rgba(37,9,228,.35);color:#fff}
.btn.perigo{color:#FF9B9B;border-color:rgba(208,59,59,.4)}
.btn.verde{color:#7FE07F;border-color:rgba(12,163,12,.45)}
.btn.peq{padding:5px 10px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.nav:focus-visible,.chip:focus-visible,tr[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.grade{display:grid;gap:14px;margin:0 6px 14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card.solto{margin:0 6px 14px}
.card.coluna{display:flex;flex-direction:column}
.card.coluna .vazio-g{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.card h2{margin:0;font:700 14.5px var(--f-tit)}
.card .sub{color:var(--tx2);font-size:12px;margin-top:2px}
.card-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.kpi{position:relative;overflow:hidden}
.kpi small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);font-weight:700}
.kpi .v{font:800 28px/1.1 var(--f-tit);margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v.menor{font-size:19px;margin-top:12px}
.kpi .d{font-size:12px;color:var(--tx2);margin-top:4px}
.kpi.destaque{background:linear-gradient(135deg,rgba(62,20,147,.55),rgba(27,156,250,.18));border-color:rgba(27,156,250,.3)}
.kpi .spark{position:absolute;right:12px;bottom:12px;width:92px;height:30px;opacity:.9}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st.ok{background:var(--ok-bg);color:#7FE07F} .st.av{background:var(--aviso-bg);color:#FFD27A} .st.se{background:var(--serio-bg);color:#FFB394} .st.cr{background:var(--crit-bg);color:#FF9B9B} .st.ne{background:rgba(148,163,184,.14);color:#C3C9D8} .st.az{background:rgba(27,156,250,.15);color:#9FD3FF}
.tab{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02);overflow-x:auto;margin:0 6px 14px}
.tab.dentro{margin:0}
table{border-collapse:collapse;width:100%}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clica{cursor:pointer} tr.clica:hover{background:rgba(255,255,255,.025)}
.nm b{display:block;font-weight:600} .nm small{color:var(--tx3);font-size:11.5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap} .dir{text-align:right} td.mini{white-space:nowrap}
.mini{color:var(--tx2);font-size:12px}
.vazio{color:var(--tx2);font-size:13px;text-align:center;padding:26px 14px}
.vazio-g{color:var(--tx2);font-size:12.5px;padding:18px 4px;text-align:center;line-height:1.5}
.barra{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.barra i{display:block;height:100%;border-radius:8px;background:var(--serie)}
.barra.av i{background:#FAB219} .barra.cr i{background:#E05252}
.linha-uso{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;margin-bottom:12px;font-size:12.5px}
.linha-uso .barra{grid-column:1/-1}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.lista li:last-child{border-bottom:0}
.lista .t{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}
.lista .t small{display:block;color:var(--tx3);font-size:11.5px}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:14px}
.graf{width:100%;height:auto;display:block;overflow:visible}
.graf text{fill:var(--tx2);font:11px var(--f)}
.graf .grade-l{stroke:rgba(255,255,255,.06)}
.barras{display:flex;flex-direction:column;gap:9px}
.b-lin{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.b-rot{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-tr{height:14px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden}
.b-tr i{display:block;height:100%;border-radius:4px;background:var(--serie)}
.b-v{font-variant-numeric:tabular-nums;font-weight:600;min-width:3ch;text-align:right}
.b-lin:hover .b-tr i{filter:brightness(1.2)}
.dica{position:fixed;z-index:50;pointer-events:none;background:#1C2033;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:240px}
.dica b{display:block;font-size:13px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 6px 12px}
.chip{border:1px solid var(--line2);background:none;color:var(--tx2);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.ciclo-gw{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip.on{background:rgba(27,156,250,.14);border-color:rgba(27,156,250,.45);color:#9FD3FF}
.busca{margin-left:auto;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:12.5px;width:280px;max-width:100%}
.fundo{position:fixed;inset:0;background:rgba(3,4,10,.62);z-index:30;display:flex;justify-content:flex-end}
.gaveta{width:min(600px,100%);height:100%;overflow-y:auto;background:var(--bg2);border-left:1px solid var(--line2);padding:22px 22px 40px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.gaveta .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.gaveta h2.nome{margin:0;font:800 20px var(--f-tit)}
.x{background:none;border:0;color:var(--tx2);font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tres b{display:block;font:700 18px var(--f-tit)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line2);border-radius:8px;padding:4px 9px;color:var(--tx)}
.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.passos span{color:var(--tx2)}
.copia{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:10px;padding:6px 6px 6px 10px}
.copia code{flex:1;min-width:0;overflow-wrap:anywhere;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9FD3FF}
.nota{font-size:12.5px;border-radius:10px;padding:9px 12px;line-height:1.5}
.nota.av{color:#FFD27A;background:var(--aviso-bg)} .nota.az{color:#9FD3FF;background:rgba(27,156,250,.1)}
.previa{border-radius:12px;overflow:hidden;border:1px solid var(--line2);height:300px;position:relative;background:#fff}
.previa iframe{border:0;width:200%;height:600px;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.campo{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.campo input,.campo select{background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--tx);border-radius:9px;padding:9px 11px;font-size:13.5px;text-transform:none;letter-spacing:0;font-weight:400}
.campo select option{background:#171A2A}
.form{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) 190px 120px auto;gap:10px;align-items:end}
.resultado{margin-top:14px;border:1px solid rgba(63,191,127,.35);background:rgba(63,191,127,.07);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.resultado code{display:block;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere;user-select:all;color:#e7ecf7}
.erro{color:#FF9B9B;font-size:12.5px;margin-top:10px}
.porta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.porta .caixa{max-width:440px;width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:28px;text-align:center}
.porta h1{margin:10px 0 6px;font:800 18px var(--f-tit)}
.porta p{margin:0 0 18px;color:var(--tx2);font-size:13px;line-height:1.55}
.modal{position:fixed;inset:0;background:rgba(3,5,12,.72);z-index:40;min-height:0}
.modal .caixa{text-align:left}
.radio{display:flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--tx);font-weight:500;text-transform:none;letter-spacing:0;font-size:13px}
.fio{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.5;background:var(--bg3);align-self:flex-start;overflow-wrap:anywhere}
.msg.tmx{background:rgba(62,20,147,.35);border-color:rgba(91,94,244,.4);align-self:flex-end}
.msg.nota{background:var(--aviso-bg);border-color:rgba(245,181,68,.3);align-self:center}
textarea.resp{width:100%;margin-top:14px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:13.5px;resize:vertical}
.sel{background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--tx);border-radius:8px;padding:6px 8px;font-size:12.5px}
.sel option{background:#171A2A}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#0F2A1F;border:1px solid rgba(63,191,127,.4);color:#BFF0D6;padding:10px 16px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px)}
.carregando{opacity:.55;pointer-events:none}
/* ── Tema claro: escolhido no botão ☀️/🌙 do topo do menu; fica guardado neste aparelho (sl_admin_tema) ── */
:root[data-tema="claro"]{
  --bg:#F4F6FB; --bg2:#FFFFFF; --bg3:#EEF1F7; --line:rgba(16,24,40,.09); --line2:rgba(16,24,40,.17);
  --tx:#121726; --tx2:#4F5872; --tx3:#757D94;
  --ok-bg:rgba(12,163,12,.12); --aviso-bg:rgba(250,178,25,.2); --serio-bg:rgba(236,131,90,.18); --crit-bg:rgba(208,59,59,.12);
  color-scheme:light;
}
[data-tema="claro"] body{background:radial-gradient(1200px 600px at 85% -10%,rgba(27,156,250,.10),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(62,20,147,.07),transparent 60%),var(--bg)}
[data-tema="claro"] .side{background:rgba(255,255,255,.88)}
[data-tema="claro"] .nav{color:#2B3247}
[data-tema="claro"] .nav:hover{background:rgba(16,24,40,.05)}
[data-tema="claro"] .nav.on{background:linear-gradient(90deg,rgba(62,20,147,.13),rgba(27,156,250,.10));color:#1E0A5C}
[data-tema="claro"] .nav .n{background:rgba(255,89,38,.14);color:#A8350C}
[data-tema="claro"] .btn{background:#fff}
[data-tema="claro"] .btn:hover{border-color:rgba(16,24,40,.32)}
[data-tema="claro"] .btn.pri{background:var(--grad)}
[data-tema="claro"] .btn.perigo{color:#B42318;border-color:rgba(180,35,24,.35)}
[data-tema="claro"] .btn.verde{color:#08700A;border-color:rgba(8,112,10,.35)}
[data-tema="claro"] .card{background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.05)}
[data-tema="claro"] .kpi.destaque{background:linear-gradient(135deg,rgba(62,20,147,.10),rgba(27,156,250,.13));border-color:rgba(27,156,250,.35)}
[data-tema="claro"] .st.ok{color:#08700A} [data-tema="claro"] .st.av{color:#7A4F00} [data-tema="claro"] .st.se{color:#9A3A10} [data-tema="claro"] .st.cr{color:#B42318}
[data-tema="claro"] .st.ne{color:#475069;background:rgba(71,80,105,.1)} [data-tema="claro"] .st.az{color:#0B5FA0;background:rgba(27,156,250,.12)}
[data-tema="claro"] .tab{background:#fff}
[data-tema="claro"] tr.clica:hover{background:rgba(16,24,40,.03)}
[data-tema="claro"] .barra,[data-tema="claro"] .b-tr{background:rgba(16,24,40,.07)}
[data-tema="claro"] .graf .grade-l{stroke:rgba(16,24,40,.09)}
[data-tema="claro"] .spark polyline,[data-tema="claro"] svg.sp polyline{stroke:#1B9CFA}
[data-tema="claro"] .dica{background:#fff;color:var(--tx);box-shadow:0 12px 30px rgba(16,24,40,.16)}
[data-tema="claro"] .chip.on{background:rgba(27,156,250,.12);border-color:rgba(27,156,250,.5);color:#0B5FA0}
[data-tema="claro"] .busca,[data-tema="claro"] .campo input,[data-tema="claro"] .campo select,[data-tema="claro"] .sel,[data-tema="claro"] textarea.resp{background:#fff}
[data-tema="claro"] .campo select option,[data-tema="claro"] .sel option{background:#fff}
[data-tema="claro"] .fundo{background:rgba(16,24,40,.32)}
[data-tema="claro"] .modal{background:rgba(16,24,40,.45)}
[data-tema="claro"] .copia{background:var(--bg3)} [data-tema="claro"] .copia code{color:#0B5FA0}
[data-tema="claro"] .nota.av{color:#6B4500} [data-tema="claro"] .nota.az{color:#0B5FA0;background:rgba(27,156,250,.10)}
[data-tema="claro"] .msg.tmx{background:rgba(62,20,147,.08);border-color:rgba(62,20,147,.25)}
[data-tema="claro"] .resultado code{background:var(--bg3);color:var(--tx)}
[data-tema="claro"] .erro{color:#B42318}
[data-tema="claro"] .pe a{color:#0B5FA0}
[data-tema="claro"] .toast{background:#ECFDF3;border-color:rgba(12,163,12,.35);color:#05603A}
[data-tema="claro"] .porta .caixa{background:#fff}
.tema{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:none;color:var(--tx);cursor:pointer;font-size:15px;display:grid;place-items:center;flex:none}
.tema:hover{border-color:var(--azul)}
.tema:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g21,.g3{grid-template-columns:1fr} }
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:12px max(12px,env(safe-area-inset-left,0px))}
  .marca{width:100%;padding-bottom:8px} .grupo,.pe{display:none} .nav{width:auto} .nav.on::before{display:none}
  .g2,.g4{grid-template-columns:1fr} .busca{margin-left:0;width:100%} .form{grid-template-columns:1fr}
}

      });
    }
    if(a.dataset.desbloquear){
      a.disabled = true;
      return api('POST', '/api/plataforma/empresas/' + encodeURIComponent(a.dataset.desbloquear) + '/desbloquear').then(function(r){ aviso(r.ok ? 'Desbloqueada: a equipe já pode entrar.' : (r.j.error || 'Não consegui desbloquear.')); return carregar(true); });
    }
    if(a.dataset.ch) return abrirChamado(a.dataset.ch);
    if(a.dataset.c){ aberto = a.dataset.c; return pintar(); }
    if(a.dataset.fped){ filtroPed = a.dataset.fped; return pintar(); }
    if(a.dataset.fcli){ filtroCli = a.dataset.fcli; return pintar(); }
    if(a.dataset.fch){ filtroCh = a.dataset.fch; return pintar(); }
    if(a.dataset.liberar){
      var ped = PEDIDOS.find(function(x){ return x.id === a.dataset.liberar; }); if(!ped) return;
      a.disabled = true; a.textContent = 'Liberando…';
      return api('POST', '/api/plataforma/convites', { email: ped.email, obs: 'Teste grátis · ' + (ped.nome || ''), dias: 7, plano: 'iniciante' }).then(function(r){
        if(!r.ok){ aviso(r.j.error || 'Não consegui gerar o convite.'); return carregar(); }
        liberado = { link: r.j.link, expira: r.j.expira, nome: ped.nome, email: ped.email, zap: ped.whatsapp };
        return carregar();
      });
    }
    if(a.dataset.cancelar){
      a.disabled = true; ultimoLink = null;   // o link mostrado pode ser justamente o que saiu
      return api('POST', '/api/plataforma/convites/' + encodeURIComponent(a.dataset.cancelar) + '/cancelar').then(function(r){
        aviso(r.ok ? 'Convite cancelado: o link não abre mais.' : (r.j.error || 'Não consegui cancelar.')); return carregar();
      });
    }
    var ac = a.dataset.acao;
    if(ac === 'atualizar'){ a.disabled = true; document.querySelector('.main') && document.querySelector('.main').classList.add('carregando'); return carregar(true).then(function(){ aviso('Atualizado.'); }); }
    if(ac === 'atualizar-aud'){ AUD = null; pintar(); return carregarAuditoria().then(pintar); }
    if(ac === 'fechar-modal'){ modal = ''; return pintar(); }
    if(ac === 'salvar-venda'){
      var links = {}, erroL = '';
      document.querySelectorAll('[data-link]').forEach(function(i){ var v = i.value.trim(); if(v && !/^https:\/\/\S+$/i.test(v)) erroL = 'O link do ' + i.dataset.rot + ' precisa começar com https://'; links[i.dataset.link] = v; });
      if(erroL) return aviso(erroL);
      a.disabled = true; a.textContent = 'Salvando…';
      return api('POST', '/api/plataforma/venda-tmx', { gateway: gwEscolhido || (VENDA && VENDA.gateway) || 'payt', links: links }).then(function(r){
        if(!r.ok){ a.disabled = false; a.textContent = 'Salvar'; if(r.j.campo){ var ic = document.querySelector('[data-link="'+r.j.campo+'"]'); if(ic) ic.focus(); } return aviso(r.j.error || 'Não consegui salvar os links.'); }
        rascunhoLinks = {}; gwEscolhido = null; aviso('Salvo. A página de planos já usa esses links.'); return carregar(true);
      });
    }
    if(ac === 'novo-token'){ confirmaToken = true; return pintar(); }
    if(ac === 'novo-token-nao'){ confirmaToken = false; return pintar(); }
    if(ac === 'novo-token-ok'){
      a.disabled = true;
      return api('POST', '/api/plataforma/venda-tmx/novo-token').then(function(r){
        confirmaToken = false; aviso(r.ok ? 'Endereço novo pronto. Troque também na Payt.' : (r.j.error || 'Não consegui gerar o endereço.')); return carregar(true);
      });
    }
    if(ac === 'tema'){
      var vaiClaro = document.documentElement.getAttribute('data-tema') !== 'claro';
      if(vaiClaro) document.documentElement.setAttribute('data-tema', 'claro'); else document.documentElement.removeAttribute('data-tema');
      try{ localStorage.setItem('sl_admin_tema', vaiClaro ? 'claro' : 'escuro'); }catch(e){}
      return pintar();
    }
    if(ac === 'voltar-suporte'){ chamado = null; return carregar(); }
    if(ac === 'confirmar-bloqueio'){
      var mot = document.getElementById('bl-motivo').value; a.disabled = true;
      return api('POST', '/api/plataforma/empresas/' + encodeURIComponent(a.dataset.id) + '/bloquear', { motivo: mot }).then(function(r){
        if(!r.ok){ a.disabled = false; document.getElementById('bl-erro').textContent = r.j.error || 'Não consegui bloquear.'; return; }
        modal = ''; aviso('Bloqueada. O pixel e as vendas continuam gravando.'); return carregar(true);
      });
    }
    if(ac === 'entrar-suporte'){
      var motivo = (document.getElementById('sp-motivo').value || '').trim();
      if(!motivo){ document.getElementById('sp-erro').textContent = 'Escreva o motivo pra entrar.'; return; }
      var modo = (document.querySelector('input[name="sp-modo"]:checked') || {}).value || 'olhar';
      a.disabled = true; a.textContent = 'Entrando…';
      return api('POST', '/api/plataforma/empresas/' + encodeURIComponent(a.dataset.id) + '/suporte', { motivo: motivo, modo: modo, minutos: Number(document.getElementById('sp-min').value), avisar: document.getElementById('sp-avisar').checked })
        .then(function(r){ if(!r.ok){ a.disabled = false; a.textContent = 'Entrar'; document.getElementById('sp-erro').textContent = r.j.error || 'Não consegui entrar.'; return; } entrarNoCliente(r.j); });
    }
    if(ac === 'responder'){
      var txt = (document.getElementById('ch-txt').value || '').trim(), nota = document.getElementById('ch-nota').checked, st = document.getElementById('ch-st').value;
      a.disabled = true;
      return api('POST', '/api/plataforma/chamados/' + chamado.id + '/responder', { texto: txt, nota: nota, status: st }).then(function(r){
        if(!r.ok){ a.disabled = false; return aviso(r.j.error || 'Não consegui enviar.'); }
        aviso(txt ? (nota ? 'Nota guardada.' : 'Resposta enviada. O cliente recebe no sininho.') : 'Situação atualizada.');
        return Promise.all([carregar(true), abrirChamado(chamado.id)]);
      });
    }
    if(ac === 'gerar'){
      var email = (document.getElementById('cv-email').value || '').trim(), obs = (document.getElementById('cv-obs').value || '').trim(), dias = document.getElementById('cv-dias').value;
      var planoCv = (document.getElementById('cv-plano') || {}).value || 'teste';
      a.disabled = true; a.textContent = 'Gerando…'; erroConvite = '';
      api('POST', '/api/plataforma/convites', { email: email, obs: obs, dias: dias, plano: planoCv }).then(function(r){
        if(!r.ok){ erroConvite = r.j.error || 'Não consegui gerar o convite.'; ultimoLink = null; return carregar(); }
        ultimoLink = { link: r.j.link, expira: r.j.expira };
        return carregar();
      });
    }
  });
  // dica dos gráficos
  document.addEventListener('mousemove', function(ev){
    var el = ev.target.closest && ev.target.closest('[data-dica]');
    if(!el){ if(!dica.hidden) dica.hidden = true; return; }
    var p = el.getAttribute('data-dica').split('|');
    dica.innerHTML = '<b>'+esc(p[1])+'</b>'+esc(p[0]); dica.hidden = false;
    dica.style.left = Math.min(ev.clientX + 14, innerWidth - 250) + 'px'; dica.style.top = (ev.clientY + 14) + 'px';
  });
  // ── entrada: só a Diretoria da TMX, com a mesma conta do TMX ──
  if(!token){ porta('Entre com a sua conta da TMX', 'A Central TMX Admin usa o mesmo login do TMX. Entre lá com a conta da Diretoria e abra esta página de novo.'); return; }
  api('GET', '/api/auth/me').then(function(r){
    if(!r.ok || !r.j.user){ return porta('Entre com a sua conta da TMX', 'A sua sessão expirou. Entre no TMX com a conta da Diretoria e abra esta página de novo.'); }
    var emp = r.j.empresa || {};
    if(emp.id && emp.id !== 'tmx'){ return porta('Esta área é só da TMX', 'Você está logado numa conta de cliente. Saia dela no TMX e entre com a conta da Diretoria da TMX.'); }
    if(r.j.user.cargo !== 'Diretoria'){ return porta('Esta área é só da Diretoria', 'A Central TMX Admin abre só pra Diretoria da TMX.'); }
    eu = r.j.user;
    try{ var av = sessionStorage.getItem('sl_admin_aviso'); if(av){ sessionStorage.removeItem('sl_admin_aviso'); setTimeout(function(){ aviso(av); }, 300); } }catch(e){}
    pintar();
    return carregar();
  }).catch(function(){ porta('Sem conexão', 'Não consegui falar com o servidor. Confira a internet e recarregue.'); });
})();
</script>
</body>
</html>
