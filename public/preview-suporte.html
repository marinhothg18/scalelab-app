<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Suporte · protótipo</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{
  --fundo:#F4F6FA; --cartao:#FFFFFF; --linha:#E2E8F0; --linha2:#EEF1F5;
  --texto:#0F172A; --texto2:#475569; --texto3:#64748B;
  --azulp:#2509E4; --roxo:#3E1493; --rosa:#C52C58; --laranja:#FF5926; --azul:#1B9CFA;
  --ok-bg:#E6F4EC; --ok:#0B6B3A; --bad-bg:#FCE9EF; --bad:#A3173F; --warn-bg:#FFF0E8; --warn:#A93A0A;
  --neu-bg:#EEF1F6; --neu:#334155; --ia-bg:#F1ECFB; --ia:#3E1493; --az-bg:#E9F4FE; --az:#075985;
}
*{box-sizing:border-box}
html{background:var(--fundo)}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--azulp)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--azulp);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* faixa do protótipo */
.proto{background:#0F172A;color:#E2E8F0;font-size:12.5px;padding:8px 16px;display:flex;gap:10px 18px;justify-content:center;align-items:center;flex-wrap:wrap}
.proto b{color:#fff}
.proto nav{display:flex;gap:4px;flex-wrap:wrap}
.proto nav a{color:#CBD5E1;text-decoration:none;font-weight:700;padding:5px 10px;border-radius:7px}
.proto nav a.on{background:#fff;color:#0F172A}

.pagina{max-width:1440px;margin:0 auto;padding:24px 32px 48px;display:flex;flex-direction:column;gap:20px}
@media (max-width:640px){.pagina{padding:16px 14px 40px}}
.topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.topo h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.topo p{margin:0;font-size:13.5px;color:var(--texto2);max-width:72ch}
.topo .esq{display:flex;flex-direction:column;gap:6px;min-width:0}
.linha-tit{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:4px 10px}
.vivo i{width:7px;height:7px;border-radius:50%;background:#16A34A}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:700;background:transparent;color:var(--neu)}
.seg button.on{background:var(--azulp);color:#fff}
.caixa-sel{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:0 10px;height:38px;font-size:12.5px;color:var(--texto2);font-weight:600}
.caixa-sel select{border:0;background:transparent;font-size:12.5px;font-weight:700;color:var(--texto)}
.btn{height:38px;border:1px solid var(--linha);background:#fff;border-radius:10px;padding:0 14px;font-size:12.5px;font-weight:700;color:var(--texto);display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn.rosa{border-color:#F1C6D3;background:#FDF1F5;color:var(--bad);font-weight:800}
.btn.rosa span{background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px}
.btn.cheio{border:0;background:var(--azulp);color:#fff;font-weight:800}

.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.metrica{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rot{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--texto3);font-weight:800}
.metrica .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.metrica .s{font-size:12px;font-weight:600;color:var(--texto2)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap}

/* caixa de entrada */
.inbox{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.painel{background:#fff;border:1px solid var(--linha);border-radius:14px;min-width:0;height:780px}
.fila{flex:1 1 300px;display:flex;flex-direction:column;overflow:hidden}
.conversa{flex:999 1 520px;display:flex;flex-direction:column;overflow:hidden}
.cliente{flex:1 1 300px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.painel{height:auto;max-height:none}.fila .lista{max-height:420px}.conversa .fio{max-height:460px}}
.fila .cab{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--linha2)}
.abas{display:flex;gap:4px;background:var(--fundo);border-radius:10px;padding:3px}
.abas button{flex:1;border:0;border-radius:7px;padding:7px 6px;font-size:12px;font-weight:700;background:transparent;color:var(--texto2)}
.abas button.on{background:#fff;color:var(--texto);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.abas button b{color:var(--texto3)}
.abas button b.alerta{color:var(--bad)}
.busca{display:flex;align-items:center;gap:8px;border:1px solid var(--linha);border-radius:10px;padding:0 10px;height:38px;color:var(--texto3)}
.busca input{border:0;outline:0;flex:1;min-width:0;font-size:13px;background:transparent;color:var(--texto)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--linha);background:#fff;color:var(--texto2);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700}
.lista{flex:1;min-height:0;overflow:auto}
.item{display:flex;gap:10px;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--linha2);background:#fff}
.item.on{background:#EEF0FF}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.item .meio{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .nome{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .esp{flex:none;font-size:11.5px;font-weight:700}
.item .prev{font-size:12.5px;color:var(--texto2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l3{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.canal{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--texto3);font-weight:600}
.vazio{padding:40px 20px;text-align:center;font-size:13px;color:var(--texto3)}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.conv-cab{padding:14px 18px;border-bottom:1px solid var(--linha2);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.conv-cab h2{margin:0;font-size:18px;font-weight:800}
.conv-cab .sub{font-size:12.5px;color:var(--texto2)}
.conv-cab .dir{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.espera{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:99px;padding:5px 10px}
.mini-sel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--texto2);font-weight:600}
.mini-sel select{height:34px;border:1px solid var(--linha);border-radius:8px;padding:0 8px;font-size:12.5px;font-weight:700;background:#fff;color:var(--texto)}
.btn-p{height:34px;border:1px solid var(--linha);background:#fff;border-radius:8px;padding:0 12px;font-size:12.5px;font-weight:700}
.btn-p.verde{border-color:#A7D7BC;background:var(--ok-bg);color:var(--ok);font-weight:800}
.resumo{margin:12px 18px 0;padding:10px 12px;border-radius:10px;background:#F4F0FC;color:#2E1170;font-size:13px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.fio{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.sis{align-self:center;font-size:11.5px;color:var(--texto2);background:var(--neu-bg);border-radius:99px;padding:5px 12px;max-width:92%;text-align:center}
.bolha{max-width:74%;display:flex;flex-direction:column;gap:3px}
.bolha .t{border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.45;white-space:pre-line}
.bolha .h{font-size:11px;color:var(--texto3)}
.bolha.cli{align-self:flex-start}
.bolha.cli .t{background:#fff;border:1px solid var(--linha);border-radius:14px 14px 14px 4px}
.bolha.ag{align-self:flex-end;align-items:flex-end}
.bolha.ag .t{background:var(--azulp);color:#fff;border-radius:14px 14px 4px 14px}
.bolha.nota{align-self:flex-end;align-items:flex-end}
.bolha.nota .t{background:#FFF6DB;border:1px dashed #D9B44A;color:#4A3700;border-radius:12px}
.sug{margin:0 18px 10px;border:1px solid #D9CCF5;background:#FBF9FF;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.sug .cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sug .tit{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--roxo)}
.sug .tit span{color:#5B4A86}
.sug .txt{font-size:13.5px;line-height:1.5;color:#1E1537;white-space:pre-line}
.porque{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.porque .rot{color:#5B4A86}
.porque span.p{font-size:11.5px;color:var(--roxo);background:#EFE8FC;border-radius:99px;padding:3px 9px;font-weight:600}
.btn-ia{height:34px;border:0;background:var(--roxo);color:#fff;border-radius:8px;padding:0 14px;font-size:12.5px;font-weight:800}
.btn-ia2{height:34px;border:1px solid #D9CCF5;background:#fff;color:var(--roxo);border-radius:8px;padding:0 12px;font-size:12.5px;font-weight:700}
.x{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:#5B4A86;display:flex;align-items:center;justify-content:center}
.compor{padding:10px 18px 16px;border-top:1px solid var(--linha2);display:flex;flex-direction:column;gap:8px}
.prontas{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prontas button{border:1px solid var(--linha);background:#F8FAFC;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700}
.tipo{display:flex;gap:14px;font-size:12.5px;font-weight:700}
.tipo button{border:0;background:transparent;padding:4px 0;color:var(--texto3);border-bottom:2px solid transparent}
.tipo button.on{color:var(--azulp);border-bottom-color:var(--azulp)}
.tipo button.on.nota{color:#7A5A00;border-bottom-color:#D9B44A}
.compor textarea{width:100%;resize:vertical;border:1px solid #D5DCE6;background:#fff;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.compor textarea.nota{border-color:#E6C766;background:#FFFBEA}
.compor .acoes{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.compor .acoes>div{display:flex;flex-wrap:wrap;gap:8px}
.btn-iab{height:36px;border:1px solid var(--roxo);background:#F4F0FC;color:var(--roxo);border-radius:9px;padding:0 12px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.btn-bco{height:36px;border:1px solid var(--linha);background:#fff;border-radius:9px;padding:0 12px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn-env{height:36px;border:0;background:var(--azulp);color:#fff;border-radius:9px;padding:0 16px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
.btn-env.nota{background:#7A5A00}
.aviso{font-size:12px;color:var(--roxo);font-weight:600}

.cli-id{display:flex;gap:12px;align-items:center}
.cli-id .av{width:46px;height:46px;font-size:15px}
.cli-id b{font-size:15px}
.cli-id span{font-size:12px;color:var(--texto3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--neu-bg);color:var(--neu)}
.campo{background:#F8FAFC;border:1px solid var(--linha2);border-radius:10px;padding:8px 10px}
.campo .rot{font-size:10px}
.campo div{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.secao{display:flex;flex-direction:column;gap:8px}
.compra{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid var(--linha2)}
.compra .e{min-width:0;display:flex;flex-direction:column;gap:2px}
.compra .e b{font-size:13px}
.compra .e span{font-size:11.5px;color:var(--texto3)}
.compra .d{flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:13px;font-weight:800}
.ponto{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4}
.ponto i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px}
.passo{display:flex;gap:10px}
.passo .trilho{flex:none;width:12px;display:flex;flex-direction:column;align-items:center}
.passo .trilho i{width:10px;height:10px;border-radius:50%;margin-top:3px}
.passo .trilho u{flex:1;width:2px;min-height:14px;text-decoration:none}
.passo .txt{padding-bottom:10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.passo .txt b{font-size:12.5px}
.passo .txt span{font-size:11.5px;color:var(--texto3)}
.acoes-cli{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acoes-cli button{min-height:38px;border-radius:9px;padding:6px 8px;font-size:12px;font-weight:800}
.nota-fonte{margin:0;font-size:11px;color:var(--texto3);line-height:1.45}

/* supervisão */
.sup-tit{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.sup-tit h2{margin:0;font-size:18px;font-weight:800}
.sup-tit span{font-size:12.5px;color:var(--texto2)}
.grade3{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
@media (max-width:400px){.grade3{grid-template-columns:1fr}}
.cartao{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cartao .cc{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cartao .cc span{font-size:11.5px;color:var(--texto3)}
.barra-l{display:grid;grid-template-columns:130px minmax(0,1fr) 30px 62px;gap:10px;align-items:center;font-size:12.5px}
.barra-l b:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trilho{height:8px;background:var(--neu-bg);border-radius:99px;overflow:hidden}
.trilho i{display:block;height:100%;border-radius:99px}
.dica{padding:10px 12px;border-radius:10px;background:#F4F0FC;color:#2E1170;font-size:12.5px;line-height:1.5}
.tabela{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto3);font-weight:800;padding:6px 8px;text-align:left}
td{padding:10px 8px;border-top:1px solid var(--linha2)}
tbody th{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--texto);border-top:1px solid var(--linha2);padding:10px 8px}
.num{text-align:right}
.rev{display:flex;gap:10px;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid var(--linha2)}
.rev span.t{flex:1;min-width:0;font-size:12.5px;line-height:1.45}
.rev button{flex:none;border:1px solid var(--linha);background:#fff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:700}

/* janela de reembolso */
.veu{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;justify-content:center;align-items:flex-start;padding:60px 16px 40px;z-index:20;overflow:auto}
.janela{width:100%;max-width:640px;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.25);display:flex;flex-direction:column;overflow:hidden}
.janela .jc{padding:16px 20px;border-bottom:1px solid var(--linha2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.janela .jc b{font-size:17px}
.janela .jc span{font-size:12px;color:var(--texto3)}
.janela .jm{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.janela .jr{padding:14px 20px 18px;border-top:1px solid var(--linha2);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.janela .jr>div{display:flex;flex-wrap:wrap;gap:8px}
.fechar{flex:none;width:36px;height:36px;border:1px solid var(--linha);background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--neu)}
.item-rb{display:flex;gap:10px;align-items:center;min-height:40px;padding:6px 10px;border:1px solid var(--linha2);border-radius:10px;cursor:pointer}
.item-rb input{width:18px;height:18px;accent-color:var(--azulp);flex:none}
.item-rb span.n{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.item-rb span.n small{font-weight:500;color:var(--texto3);font-size:12px}
.rotulo-campo{display:flex;flex-direction:column;gap:6px}
.rotulo-campo select,.rotulo-campo textarea,.rotulo-campo input{border:1px solid #D5DCE6;border-radius:9px;padding:9px 11px;font-size:13.5px;background:#fff;color:var(--texto)}
.rotulo-campo select{height:40px;padding:0 10px}
.erro{font-size:12.5px;color:var(--bad);font-weight:700;background:var(--bad-bg);border-radius:9px;padding:8px 10px}
fieldset{margin:0;border:0;padding:0;min-width:0}
legend{padding:0}

/* reembolsos */
.duas{display:flex;flex-wrap:wrap;gap:16px}
.grande{flex:999 1 560px;min-width:0}
.lateral{flex:1 1 360px;min-width:0}
.motivo{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) 34px 46px 120px;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:10px;padding:8px 10px}
.motivo.on{border-color:var(--azulp);background:#F2F0FF}
.motivo b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motivo .trilho{height:10px}
@media (max-width:700px){.motivo{grid-template-columns:minmax(0,1fr) 34px 46px}.motivo .trilho,.motivo .dl{display:none}}
.corrigir{background:#FBF9FF;border:1px solid #D9CCF5}
.acao-ia{background:#fff;border:1px solid #E7DEF8;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.acao-ia .n{flex:none;font-size:12px;font-weight:800;color:#fff;background:var(--roxo);border-radius:99px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.histo{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.histo div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;font-size:11.5px;font-weight:800}
.histo div i{width:100%;border-radius:6px 6px 2px 2px}
.histo-r{display:flex;gap:8px}
.histo-r span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--texto3);line-height:1.25}
.taxa{display:flex;flex-direction:column;gap:5px;padding-bottom:8px;border-bottom:1px solid var(--linha2)}
.taxa div{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.taxa span{font-size:11.5px}
figure{margin:0;padding:10px 12px;background:#F8FAFC;border:1px solid var(--linha2);border-radius:10px;display:flex;flex-direction:column;gap:4px}
blockquote{margin:0;font-size:13.5px;line-height:1.45}
figcaption{font-size:11.5px;color:var(--texto3)}

/* formulário do cliente */
.cel{max-width:420px;margin:0 auto;background:var(--fundo);min-height:100vh;border-left:1px solid var(--linha);border-right:1px solid var(--linha)}
@media (max-width:440px){.cel{border:0}}
.cel .marca{background:#fff;border-bottom:1px solid var(--linha);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.cel .marca b{font-size:17px;letter-spacing:-.02em;color:var(--roxo)}
.cel .marca span{font-size:11.5px;color:var(--texto3)}
.cel form,.cel .feito{padding:20px 18px 32px;display:flex;flex-direction:column;gap:18px}
.cel h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.cel p{margin:0;font-size:14px;color:var(--texto2);line-height:1.5}
.bloco{border:1px solid var(--linha);background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cel legend.grande-l{font-size:16px;font-weight:800;margin-bottom:8px}
.op{display:flex;gap:12px;align-items:center;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--linha);background:#fff;cursor:pointer;margin-bottom:8px}
.op.on{border-color:var(--azulp);background:#F2F0FF}
.op input{width:18px;height:18px;accent-color:var(--azulp);flex:none}
.op span{font-size:14px;font-weight:600;line-height:1.35}
.it{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer}
.it input{width:20px;height:20px;accent-color:var(--azulp);flex:none}
.it .e{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.it .e b{font-size:14px}
.it .e span{font-size:12px;color:var(--texto3)}
.ch{min-height:40px;border:1.5px solid #D5DCE6;background:#fff;border-radius:99px;padding:0 14px;font-size:13px;font-weight:700}
.ch.on{border-color:var(--azulp);background:var(--azulp);color:#fff}
.uso{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.uso button{min-height:46px;border:1.5px solid #D5DCE6;background:#fff;border-radius:12px;font-size:13px;font-weight:700}
.uso button.on{border-color:var(--azulp);background:#F2F0FF;color:var(--azulp)}
.ajuda{background:var(--az-bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:#0B3A5C;line-height:1.45}
.ajuda button{align-self:flex-start;min-height:40px;border-radius:10px;padding:0 14px;background:#fff;border:1px solid #B9DDF9;font-size:13px;font-weight:800;color:var(--az)}
.enviar-cel{min-height:52px;border:0;background:var(--azulp);color:#fff;border-radius:14px;font-size:16px;font-weight:800}
.check{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center}
.passo-f{display:flex;gap:10px;font-size:14px;line-height:1.45}
.passo-f b{color:var(--azulp)}

/* fila inteligente, lote e atalhos */
.lote{display:flex;align-items:center;gap:8px;margin:0;padding:9px 14px;background:#F4F0FC;color:#2E1170;font-size:12.5px;border-bottom:1px solid var(--linha2)}
.lote span{flex:1;min-width:0}
.lote button{border:0;background:var(--roxo);color:#fff;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:800}
.ia-l{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--texto2);min-width:0}
.ia-l span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.atalhos{font-size:11px;color:var(--texto3);padding:8px 14px;border-top:1px solid var(--linha2);line-height:1.5}
.atalhos b{color:var(--texto2)}
@media (max-width:900px){.atalhos{display:none}}
.risco{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#F8FAFC;border:1px solid var(--linha2);border-radius:10px;padding:10px 12px}
.risco>div{display:flex;flex-direction:column;gap:4px}
.risco b{font-size:14px}
.risco .pq{grid-column:1 / -1;font-size:11.5px;color:var(--texto3);line-height:1.45}
.lote-item{border:1px solid var(--linha);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lote-item.fora{opacity:.55}
.lote-item .ultima{font-size:12.5px;color:var(--texto2);background:#F8FAFC;border-radius:8px;padding:6px 10px}
.lote-item textarea{width:100%;border:1px solid #D5DCE6;border-radius:9px;padding:9px 11px;font-size:13.5px;line-height:1.45;resize:vertical}
/* prevenção */
.prev-it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha2)}
.prev-it b{display:block;font-size:13.5px}
.prev-it span{font-size:12px;color:var(--texto3)}
/* automações */
.auto .auto-l{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.auto .frase{font-size:14px;line-height:1.8;min-width:0}
.auto .frase .rot{font-size:10.5px}
.auto.desl{opacity:.65}
.chave{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;cursor:pointer}
.chave input{appearance:none;width:40px;height:22px;border-radius:99px;background:#CBD5E1;position:relative;cursor:pointer;transition:background .15s;flex:none}
.chave input::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.chave input:checked{background:#16A34A}
.chave input:checked::after{left:21px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0F172A;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(15,23,42,.3)}
</style>

    if(b && (c.nome+' '+c.email+' '+c.contato).toLowerCase().indexOf(b) < 0) return false;

  });

      '<span class="l3"><span class="canal">'+ICO[c.canal]+CANAL[c.canal]+'</span>'+pill(c.assunto, ASSUNTO_TOM[c.assunto]||'neu')+pill(c.compra, c.compraTom)+'</span>'+

        '<div class="dica"><b>Fica assim:</b> quando '+esc((S.autoForm.quando||'').toLowerCase())+', '+esc(S.autoForm.espera||'')+
          (S.autoForm.se && S.autoForm.se !== '(sempre)' ? ', se '+esc(S.autoForm.se) : '')+', a Central '+esc(S.autoForm.entao||'')+'.</div>'+
      '</div><div class="jr"><span></span><div><button class="btn" data-acao="autoFechar">Cancelar</button><button class="btn cheio" data-acao="autoSalvar">Criar e ligar</button></div></div>'+
    '</div></div>' : '')+
  '</div>';
}

// ══════════════════════════════════════════════════════
// TELA · RESPOSTAS PRONTAS
// ══════════════════════════════════════════════════════
var PRONTAS_STATS = {
  'Reenviar acesso': { usos:182, resolve:.88, nota:'4,8' },
  'Acesso pelo celular': { usos:64, resolve:.81, nota:'4,7' },
  'Pix novo': { usos:57, resolve:.74, nota:'4,6' },
  'Garantia de 7 dias': { usos:21, resolve:.62, nota:'4,2' },
  'Boleto': { usos:18, resolve:.90, nota:'4,9' },
  'Formulário de reembolso': { usos:9, resolve:1, nota:null }
};
var PRONTAS_SUG = [
  { n:'Trocar o e-mail de acesso', vezes:9, x:'Consigo trocar sim! Me manda o e-mail novo que eu atualizo no seu acesso. Em até 10 minutos você já entra com ele.' },
  { n:'Parcelamento no cartão', vezes:6, x:'Dá pra parcelar no cartão. É só escolher o número de parcelas na hora de pagar: [link do checkout].' },
  { n:'Serve pro meu concurso?', vezes:5, x:'A apostila segue o edital mais recente. Me fala qual concurso e cargo que eu confirmo pra você.' }
];
function telaProntas(){
  var sugs = PRONTAS_SUG.map(function(sg, i){ return { sg:sg, i:i }; }).filter(function(x){ return !S.sugCriadas[x.i]; });
  return '<div class="pagina">'+
    '<header class="topo"><div class="esq"><h1>Respostas prontas</h1><p>As respostas que a equipe usa no atendimento, e como cada uma está se saindo. Mudou aqui, muda no atendimento na hora.</p></div></header>'+
    '<div class="duas"><section class="cartao grande" aria-label="Respostas prontas">'+
      '<div class="tabela"><table style="min-width:560px"><thead><tr><th scope="col">Resposta</th><th scope="col" class="num">Usada</th><th scope="col" class="num">Resolve na 1ª</th><th scope="col" class="num">Nota</th><th scope="col"></th></tr></thead><tbody>'+
      PRONTAS.map(function(r, i){
        var st = PRONTAS_STATS[r.n] || { usos:0, resolve:null, nota:null };
        return '<tr><td><b>'+esc(r.n)+'</b><div style="font-size:12px;color:#64748B;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.x)+'</div></td>'+
          '<td class="num">'+st.usos+'x</td><td class="num" style="font-weight:700;color:'+(st.resolve != null && st.resolve < .7 ? '#A93A0A' : '#0F172A')+'">'+(st.resolve == null ? '—' : pctBr(st.resolve, 0))+'</td>'+
          '<td class="num">'+(st.nota || '—')+'</td><td class="num"><button class="btn-p" data-acao="prontaEditar" data-arg="'+i+'">Editar</button></td></tr>';
      }).join('')+'</tbody></table></div>'+
      '<span style="font-size:11.5px;color:#64748B">"Resolve na 1ª": a conversa foi resolvida sem o cliente precisar voltar depois dessa resposta. Abaixo de 70% vale reescrever.</span>'+
    '</section><section class="cartao lateral corrigir" aria-label="A IA sugere criar">'+
      '<div style="display:flex;align-items:center;gap:8px;color:#3E1493">'+ICO.ia+'<b style="font-size:15px">A IA sugere criar</b></div>'+
      '<span style="font-size:12px;color:#5B4A86">Perguntas que se repetiram esta semana e ainda não têm resposta pronta</span>'+
      (sugs.length ? sugs.map(function(x){
        return '<div class="acao-ia"><b style="font-size:13.5px">'+esc(x.sg.n)+'</b><span style="font-size:11.5px;color:#5B4A86">'+x.sg.vezes+' perguntas parecidas esta semana</span>'+
          '<span style="font-size:12.5px;color:#334155;line-height:1.5">“'+esc(x.sg.x)+'”</span>'+
          '<button class="btn-ia" style="align-self:flex-start" data-acao="prontaCriar" data-arg="'+x.i+'">Criar resposta pronta</button></div>';
      }).join('') : '<span style="font-size:12.5px;color:#334155">Nada novo por enquanto.</span>')+
    '</section></div>'+
    (S.prontaEdit >= 0 ? '<div class="veu" data-acao="veu"><div class="janela" role="dialog" aria-modal="true" aria-label="Editar resposta pronta">'+
      '<div class="jc"><b>'+esc(PRONTAS[S.prontaEdit].n)+'</b><button class="fechar" data-acao="prontaFechar" aria-label="Fechar">'+ICO.x+'</button></div>'+
      '<div class="jm"><label class="rotulo-campo"><span class="rot">Texto</span><textarea rows="6" data-campo="prontaTxt">'+esc(S.prontaTxt)+'</textarea></label>'+
        '<span style="font-size:12px;color:#64748B">Use [e-mail], [link de acesso], [link do Pix] e [link do checkout]: o atendimento troca pelos dados da pessoa.</span></div>'+
      '<div class="jr"><span></span><div><button class="btn" data-acao="prontaFechar">Cancelar</button><button class="btn cheio" data-acao="prontaSalvar">Salvar</button></div></div>'+
    '</div></div>' : '')+
  '</div>';
}

// ══════════════════════════════════════════════════════
// desenhar e reagir
// ══════════════════════════════════════════════════════
function render(){
  var app = document.getElementById('app');
  var T = { reembolsos: telaReembolsos, formulario: telaFormulario, prevencao: telaPrevencao, automacoes: telaAutomacoes, prontas: telaProntas };
  app.innerHTML = (T[S.tela] || telaSuporte)();
  document.querySelectorAll('.proto nav a').forEach(function(a){ a.classList.toggle('on', a.dataset.tela === S.tela); a.setAttribute('aria-current', a.dataset.tela === S.tela ? 'page' : 'false'); });
  var fio = document.getElementById('fio'); if(fio) fio.scrollTop = fio.scrollHeight;
}
function rota(){
  var t = (location.hash || '#suporte').slice(1);
  S.tela = ['suporte','prevencao','automacoes','prontas','reembolsos','formulario'].indexOf(t) >= 0 ? t : 'suporte';
  S.modal = false; S.lote = ''; S.autoNova = false; S.prontaEdit = -1;
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', rota);

var ACOES = {
  toast: function(a){ toast(a); },
  periodo: function(a){ mudar({ periodo:a }); },
  aba: function(a){ mudar({ aba:a }); },
  assunto: function(a){ mudar({ assunto:a }); },
  abrir: function(id){ var c = conv(id); mudar({ sel:id, sug: c.sugestoes.length > 0 && statusDe(c) !== 'resolvido', sugIdx:0, draft:'', nota:false, aviso:'' }); },
  revisar: function(id){ var c = conv(id); mudar({ sel:id, aba: statusDe(c)==='resolvido' ? 'resolvidas' : 'andamento', assunto:'todos', canal:'todos', busca:'',
    sug: c.sugestoes.length > 0 && statusDe(c) !== 'resolvido', sugIdx:0, draft:'', nota:false, aviso:'' });
    var el = document.querySelector('.inbox'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); },
  resolver: function(){ var c = conv(S.sel); mudar({ status: setDe(S.status, c.id, 'resolvido'), sug:false, enviados: adicionar(c, [{t:'sis',x:'Marcada como resolvida por você',h:'agora'}]), aviso:'Conversa resolvida.' }); },
  descartar: function(){ mudar({ sug:false }); },
  usarSug: function(){ var c = conv(S.sel); mudar({ draft: c.sugestoes[S.sugIdx % c.sugestoes.length], sug:false, nota:false, aviso:'Sugestão no campo de resposta. Revise e envie.' }); },
  outraSug: function(){ mudar({ sugIdx: S.sugIdx + 1 }); },
  pedirIA: function(){ var c = conv(S.sel); if(c.sugestoes.length) mudar({ sug:true, aviso:'' }); else mudar({ aviso:'Essa conversa já está resolvida: não há o que sugerir.' }); },
  melhorar: function(){
    var c = conv(S.sel), t = (S.draft || '').trim();
    if(!t){ mudar({ aviso:'Escreva algo primeiro, ou use "Responder com IA".' }); return; }
    if(!/^(oi|olá|ola|bom dia|boa tarde|boa noite)/i.test(t)) t = 'Oi, '+primeiro(c)+'! '+t.charAt(0).toUpperCase()+t.slice(1);
    if(!/[.!?]$/.test(t)) t += '.';
    if(!/me cham|qualquer dúvida/i.test(t)) t += ' Qualquer dúvida, é só me chamar aqui.';
    mudar({ draft:t, aviso:'A IA ajustou a saudação, a pontuação e o fechamento. Confira antes de enviar.' });
  },
  pronta: function(i){ var c = conv(S.sel); mudar({ draft: 'Oi, '+primeiro(c)+'! '+PRONTAS[+i].x.replace('[e-mail]', c.email), nota:false, aviso:'' }); },
  nota: function(a){ mudar({ nota: a === '1' }); },
  enviar: function(){
    var c = conv(S.sel), t = (S.draft || '').trim();
    if(!t){ mudar({ aviso:'Nada pra enviar ainda.' }); return; }
    var x = { enviados: adicionar(c, [{ t: S.nota ? 'nota' : 'ag', x:t, h:'agora', a:'Você' }]), draft:'', sug:false };
    if(!S.nota){
      x.respondidos = setDe(S.respondidos, c.id, true);
      if(statusDe(c) === 'aberto') x.status = setDe(S.status, c.id, 'aguardando');
      x.aviso = 'Enviado '+PELO[c.canal]+'. A conversa foi pra "aguardando cliente". (Protótipo: nada sai daqui.)';
    } else x.aviso = 'Nota salva. Só a equipe vê.';
    mudar(x);
  },
  acaoAcesso: function(){ var c = conv(S.sel); mudar({ enviados: adicionar(c, [{t:'sis',x:'Acesso reenviado para '+c.email+' por você',h:'agora'}]), aviso:'Acesso reenviado. Ficou registrado na conversa.' }); },
  acaoPix: function(){ var c = conv(S.sel); mudar({ enviados: adicionar(c, [{t:'sis',x:'Pix novo gerado · R$ 97,00 · vale 30 min · por você',h:'agora'}]), draft:'Oi, '+primeiro(c)+'! '+PRONTAS[2].x, nota:false, aviso:'Pix gerado. O link já está no campo de resposta.' }); },
  abrirReembolso: function(){ var d = REEMB[S.sel]; mudar({ modal:true, rbMotivo: d ? d.motivo : '', rbDetalhe: d ? d.detalhe : '', rbItens:{}, rbErro:'' }); },
  fecharModal: function(){ mudar({ modal:false }); },
  veu: function(a, el, ev){ if(ev.target === el) mudar({ modal:false, lote:'', autoNova:false, prontaEdit:-1 }); },
  // responder em lote
  abrirLote: function(id){ mudar({ lote:id, loteFora:{}, loteTxt:{} }); },
  fecharLote: function(){ mudar({ lote:'' }); },
  enviarLote: function(){
    var l = LOTES.filter(function(x){ return x.id === S.lote; })[0]; if(!l) return;
    var env = Object.assign({}, S.enviados), resp = Object.assign({}, S.respondidos), st = Object.assign({}, S.status), n = 0;
    l.conversas.forEach(function(id){
      var c = conv(id); if(!semResp(c) || S.loteFora[id]) return;
      var t = S.loteTxt[id] != null ? S.loteTxt[id] : c.sugestoes[0];
      env[id] = (env[id] || []).concat([{ t:'ag', x:t, h:'agora', a:'Você' }]); resp[id] = true;
      if(statusDe(c) === 'aberto') st[id] = 'aguardando';
      n++;
    });
    mudar({ enviados:env, respondidos:resp, status:st, lote:'', sug:false });
    toast(n+' resposta'+(n===1?'':'s')+' enviada'+(n===1?'':'s')+'. As conversas foram pra "aguardando cliente". (Protótipo: nada sai daqui.)');
  },
  // prevenção
  prevAvisar: function(id){
    var g = null, it = null;
    PREV.forEach(function(x){ x.itens.forEach(function(y){ if(y.id === id){ g = x; it = y; } }); });
    if(!it) return;
    mudar({ prevFeitos: setDe(S.prevFeitos, id, true) });
    toast(it.nome+': '+g.acao.toLowerCase()+' — enviado. (Protótipo: nada sai daqui.)');
  },
  prevTodos: function(gid){
    var g = PREV.filter(function(x){ return x.id === gid; })[0]; if(!g) return;
    var f = Object.assign({}, S.prevFeitos), n = 0;
    g.itens.forEach(function(y){ if(!f[y.id]){ f[y.id] = true; n++; } });
    mudar({ prevFeitos:f });
    toast(n+' aviso'+(n===1?'':'s')+' enviado'+(n===1?'':'s')+': '+g.acao.toLowerCase()+'. (Protótipo.)');
  },
  // automações
  autoTroca: function(id){
    var a = todasAutos().filter(function(x){ return x.id === id; })[0]; if(!a) return;
    var on = !autoLigada(a);
    mudar({ autosOn: setDe(S.autosOn, id, on) });
    toast(on ? 'Automação ligada.' : 'Automação desligada.');
  },
  autoNova: function(){ mudar({ autoNova:true, autoForm:{ quando:AUTO_OP.quando[0], espera:AUTO_OP.espera[2], se:AUTO_OP.se[1], entao:AUTO_OP.entao[0], pronta:'0' } }); },
  autoFechar: function(){ mudar({ autoNova:false }); },
  autoSalvar: function(){
    var f = S.autoForm, pr = PRONTAS[+f.pronta];
    var entao = /resposta pronta/.test(f.entao) ? f.entao.replace('uma resposta pronta', 'a resposta pronta "'+(pr ? pr.n : '')+'"') : f.entao;
    var nova = { id:'n'+Date.now(), on:true, quando:f.quando, espera:f.espera, se: f.se === '(sempre)' ? '' : f.se, entao:entao, semana:'Criada agora · ainda não rodou' };
    mudar({ autosNovas: S.autosNovas.concat([nova]), autoNova:false });
    toast('Automação criada e ligada.');
  },
  // respostas prontas
  prontaEditar: function(i){ mudar({ prontaEdit:+i, prontaTxt: PRONTAS[+i].x }); },
  prontaFechar: function(){ mudar({ prontaEdit:-1 }); },
  prontaSalvar: function(){
    var t = (S.prontaTxt || '').trim(); if(!t){ toast('A resposta não pode ficar vazia.'); return; }
    PRONTAS[S.prontaEdit].x = t; mudar({ prontaEdit:-1 }); toast('Resposta pronta salva. Já aparece no atendimento.');
  },
  prontaCriar: function(i){
    var sg = PRONTAS_SUG[+i]; if(!sg) return;
    PRONTAS.push({ n:sg.n, x:sg.x });
    PRONTAS_STATS[sg.n] = { usos:0, resolve:null, nota:null };
    mudar({ sugCriadas: setDe(S.sugCriadas, i, true) });
    toast('"'+sg.n+'" criada. Já aparece nas prontas do atendimento.');
  },
  mandarForm: function(){
    var c = conv(S.sel);
    var x = { enviados: adicionar(c, [{ t:'ag', x:'Oi, '+primeiro(c)+'! '+PRONTAS[5].x, h:'agora', a:'Você' }]), modal:false, sug:false,
      respondidos: setDe(S.respondidos, c.id, true), aviso:'Formulário enviado. Quando '+primeiro(c)+' responder, o pedido aparece em Reembolsos e motivos.' };
    if(statusDe(c) === 'aberto') x.status = setDe(S.status, c.id, 'aguardando');
    mudar(x);
  },
  registrar: function(){
    var c = conv(S.sel), d = REEMB[c.id]; if(!d) return;
    var total = d.itens.reduce(function(t, it, i){ return t + (S.rbItens[i] !== false ? it.v : 0); }, 0);
    if(!total){ mudar({ rbErro:'Marque pelo menos um item pra reembolsar.' }); return; }
    if(!S.rbMotivo){ mudar({ rbErro:'Escolha o motivo. Se o cliente não quis dizer, use "Prefere não dizer".' }); return; }
    var prot = d.protocolo || 'R-1043';
    mudar({ modal:false, sug:false, enviados: adicionar(c, [{t:'sis',x:'Reembolso '+prot+' registrado por você · '+MOTIVO_NOME[S.rbMotivo]+' · '+real(total)+' · '+d.devolve,h:'agora'}]),
      aviso:'Reembolso '+prot+' registrado. O motivo já conta em Reembolsos e motivos.' });
  },
  rPeriodo: function(a){ mudar({ rPeriodo:a }); },
  rMotivo: function(a){ mudar({ rMotivo: S.rMotivo === a ? '' : a }); },
  copiar: function(){ mudar({ copiado:true }); toast('No produto de verdade, o link do formulário vai pra área de transferência.'); },
  fChip: function(n){ var o = Object.assign({}, S.fChips); o[n] = !o[n]; mudar({ fChips:o }); },
  fUso: function(a){ mudar({ fUso:a }); },
  fVoltar: function(){ mudar({ fFeito:false }); }
};
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-acao]'); if(!el) return;
  var f = ACOES[el.dataset.acao]; if(!f) return;
  if(el.dataset.acao === 'veu'){ f(null, el, ev); return; }
  f(el.dataset.arg, el, ev);
});
// Atalhos: J/K (ou setas) navegam na fila, R pede a sugestão da IA, U usa a
// sugestão, E resolve, / vai pra busca, Ctrl+Enter envia. Nunca enquanto se digita.
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape'){ if(S.modal || S.lote || S.autoNova || S.prontaEdit >= 0) mudar({ modal:false, lote:'', autoNova:false, prontaEdit:-1 }); return; }
  if(S.tela !== 'suporte' || S.modal || S.lote) return;
  var t = ev.target, digitando = t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if(digitando){
    if(t.dataset && t.dataset.campo === 'draft' && (ev.ctrlKey || ev.metaKey) && ev.key === 'Enter'){ ev.preventDefault(); ACOES.enviar(); }
    return;
  }
  if(ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var k = ev.key.toLowerCase();
  if(k === 'j' || k === 'arrowdown' || k === 'k' || k === 'arrowup'){
    var ids = Array.prototype.map.call(document.querySelectorAll('#fila-lista .item'), function(el){ return el.dataset.arg; });
    if(!ids.length) return;
    var i = ids.indexOf(S.sel), prox = (k === 'j' || k === 'arrowdown') ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1);
    if(i < 0) prox = 0;
    ACOES.abrir(ids[prox]);
    var el = document.querySelector('#fila-lista .item.on'); if(el) el.scrollIntoView({ block:'nearest' });
  }
  else if(k === 'r') ACOES.pedirIA();
  else if(k === 'u'){ if(S.sug) { ACOES.usarSug(); var tx = document.querySelector('textarea[data-campo="draft"]'); if(tx) tx.focus(); } }
  else if(k === 'e') ACOES.resolver();
  else if(k === '/'){ var b = document.getElementById('busca'); if(b) b.focus(); }
  else return;
  ev.preventDefault();
});
// digitar não redesenha a tela (perderia o cursor); só guarda
document.addEventListener('input', function(ev){
  var c = ev.target.dataset && ev.target.dataset.campo; if(!c) return;
  if(c === 'busca'){ S.busca = ev.target.value; document.getElementById('fila-lista').innerHTML = filaLista(); return; }
  if(c === 'draft' || c === 'rbDetalhe' || c === 'fCampo' || c === 'fTexto' || c === 'prontaTxt') S[c] = ev.target.value;
  if(c === 'loteTxt') S.loteTxt[ev.target.dataset.arg] = ev.target.value;
});
document.addEventListener('change', function(ev){
  var t = ev.target, c = t.dataset && t.dataset.campo; if(!c) return;
  if(c === 'ordem') mudar({ ordem:t.value });
  else if(c === 'loteInclui') mudar({ loteFora: setDe(S.loteFora, t.dataset.arg, !t.checked) });
  else if(c.indexOf('auto_') === 0) mudar({ autoForm: setDe(S.autoForm, c.slice(5), t.value) });
  else if(c === 'canal') mudar({ canal:t.value });
  else if(c === 'statusConv') mudar({ status: setDe(S.status, S.sel, t.value) });
  else if(c === 'rbMotivo') mudar({ rbMotivo:t.value, rbErro:'' });
  else if(c === 'rbItem'){ var i = t.dataset.arg; mudar({ rbItens: setDe(S.rbItens, i, t.checked), rbErro:'' }); }
  else if(c === 'fItem') mudar({ fItens: setDe(S.fItens, t.dataset.arg, t.checked), fErro:'' });
  else if(c === 'fMotivo') mudar({ fMotivo:t.value, fChips:{}, fCampo:'', fErro:'' });
});
document.addEventListener('submit', function(ev){
  if(ev.target.id !== 'form-rb') return;
  ev.preventDefault();
  var total = ITENS_F.filter(function(i){ return S.fItens[i.k]; }).length;
  if(!total){ mudar({ fErro:'Marque pelo menos um item pra reembolsar.' }); return; }
  if(!S.fMotivo){ mudar({ fErro:'Escolha uma opção em "O que aconteceu?" (pode ser "Prefiro não dizer").' }); return; }
  mudar({ fFeito:true, fErro:'' }); window.scrollTo(0, 0);
});
rota();
</script>
